  /* ---- image upload (cells and option logos) ---- */
  /* read a chosen file and shrink it to the compact stored size */
  function resizeImageToDataURL(file, maxDim, callback){
    var reader = new FileReader();
    reader.onload = function(evt){
      var img = new Image();
      img.onload = function(){
        var out;
        try { out = encodeImage(img, maxDim); }
        catch (err){ out = evt.target.result; }
        callback(out);
      };
      img.onerror = function(){ callback(null); };
      img.src = evt.target.result;
    };
    reader.onerror = function(){ callback(null); };
    reader.readAsDataURL(file);
  }

  function onImageChosen(e){
    var file = e.target.files[0];
    var target = pendingImage;
    pendingImage = null;
    if (!file || !target){ e.target.value = ''; return; }
    if (!file.type || file.type.indexOf('image/') !== 0){
      alert('Please choose an image file.');
      e.target.value = '';
      return;
    }
    resizeImageToDataURL(file, IMG_MAX, function(url){
      e.target.value = '';
      if (!url){ alert('Could not read that image file.'); return; }
      var imgId = internImage(url);
      if (target.kind === 'cell'){
        var row = rowById(target.rowId), col = colById(target.colId);
        if (row && col) commitCell(row, col, imgId);
      } else {
        var c = colById(target.colId), o = c && optById(c, target.optId);
        if (o){ o.img = imgId; scheduleSave(); if (optionsEditorRedraw && dialogOpen()) optionsEditorRedraw(); render(); }
      }
    });
  }

  /* ================= rankings ================= */
  function isLiveMode(){ return !rankingsState.dateStr || rankingsState.dateStr >= todayStr(); }

  function rankingsSourceRows(){
    if (isLiveMode()){
      return table.rows.map(function(r){ var s = snapshotOf(r); return {id: r.id, label: s.label, m: s.m, g: s.g}; });
    }
    return rowsAsOf(new Date(rankingsState.dateStr + 'T23:59:59.999').getTime());
  }

  function rankingTabs(){
    var tabs = [{id: 'row', label: 'By Row'}];
    groupableCols().forEach(function(c){ tabs.push({id: c.id, label: 'By ' + c.name}); });
    return tabs;
  }

  function computeGroupRankings(col, rows){
    var buckets = {}, order = [];
    rows.forEach(function(r){
      var k = (r.g && r.g[col.id]) || 'Unspecified';
      if (!buckets[k]){ buckets[k] = {name: k, count: 0, total: 0, n: 0}; order.push(k); }
      var b = buckets[k];
      b.count++;
      if (r.m != null){ b.total += r.m; b.n++; }
    });
    var out = order.map(function(k){
      var b = buckets[k];
      return {name: k, count: b.count, total: b.total, avg: b.n ? b.total / b.n : null};
    });
    var f = rankingsState.sortField;
    out.sort(function(a, b){
      var av = a[f] == null ? -Infinity : a[f], bv = b[f] == null ? -Infinity : b[f];
      var diff = rankingsState.sortDir === 'desc' ? bv - av : av - bv;
      if (diff !== 0 && !isNaN(diff)) return diff;
      return a.name.localeCompare(b.name);
    });
    return out;
  }

  function renderRankings(){
    var body = $('rankings-body');
    var tabs = rankingTabs();
    if (!tabs.some(function(t){ return t.id === rankingsState.tab; })){ rankingsState.tab = 'row'; rankingsState.sortField = 'm'; }
    $('rankings-tabs').innerHTML = tabs.map(function(t){
      return '<button class="modal-tab' + (t.id === rankingsState.tab ? ' active' : '') + '" data-tab="' + esc(t.id) + '">' + esc(t.label) + '</button>';
    }).join('');
    var note = $('rankings-asof-note');
    note.textContent = isLiveMode() ? '' : ('Showing rankings as of ' + fmtDate(rankingsState.dateStr) + '.');

    if (!table.metricId){
      body.innerHTML = '<div class="rank-empty">Rankings need a number column to rank by.<br>Open a number column\u2019s menu and choose \u201CUse for rankings &amp; trends\u201D.</div>';
      return;
    }
    var rows = rankingsSourceRows();
    if (!rows.length){
      body.innerHTML = '<div class="rank-empty">' + (isLiveMode() ? 'No rows yet.' : 'No history recorded as of this date yet.') + '</div>';
      return;
    }
    function arrow(f){
      if (rankingsState.sortField !== f) return '';
      return '<span class="sort-arrow">' + (rankingsState.sortDir === 'desc' ? '\u2193' : '\u2191') + '</span>';
    }
    function sortClass(f){ return rankingsState.sortField === f ? ' active-sort' : ''; }
    var mname = esc(metricName());
    var html;

    if (rankingsState.tab === 'row'){
      var gcols = groupableCols();
      var f = rankingsState.sortField === 'label' ? 'label' : 'm';
      rows = rows.slice().sort(function(a, b){
        if (f === 'label'){
          var d = a.label.localeCompare(b.label);
          return rankingsState.sortDir === 'desc' ? -d : d;
        }
        var av = a.m == null ? -Infinity : a.m, bv = b.m == null ? -Infinity : b.m;
        if (av === bv) return a.label.localeCompare(b.label);
        return rankingsState.sortDir === 'desc' ? (bv > av ? 1 : -1) : (av > bv ? 1 : -1);
      });
      html = '<table class="rank-table"><thead><tr><th class="rank-num">#</th>';
      html += '<th class="sortable' + sortClass('label') + '" data-sort="label">' + esc(primaryCol().name) + arrow('label') + '</th>';
      gcols.forEach(function(c){ html += '<th>' + esc(c.name) + '</th>'; });
      html += '<th class="sortable' + sortClass('m') + '" data-sort="m" style="text-align:right;">' + mname + arrow('m') + '</th></tr></thead><tbody>';
      rows.forEach(function(r, i){
        html += '<tr><td class="rank-num">' + (i + 1) + '</td><td><div class="rank-name"><span class="val">' + esc(r.label) + '</span></div></td>';
        gcols.forEach(function(c){
          var k = (r.g && r.g[c.id]) || '';
          html += '<td><div class="rank-name">' + groupIcon(c, k) + '<span class="val">' + (k ? esc(k) : '<span style="color:var(--text-faint)">\u2014</span>') + '</span></div></td>';
        });
        html += '<td class="rank-total">' + (r.m == null ? '\u2014' : esc(fmtNumber(r.m))) + '</td></tr>';
      });
      html += '</tbody></table>';
    } else {
      var col = colById(rankingsState.tab);
      var grows = computeGroupRankings(col, rows);
      html = '<table class="rank-table"><thead><tr><th class="rank-num">#</th><th>' + esc(col.name) + '</th>';
      html += '<th class="sortable' + sortClass('count') + '" data-sort="count" style="text-align:right;">Rows' + arrow('count') + '</th>';
      html += '<th class="sortable' + sortClass('total') + '" data-sort="total" style="text-align:right;">Total ' + mname + arrow('total') + '</th>';
      html += '<th class="sortable' + sortClass('avg') + '" data-sort="avg" style="text-align:right;">Average' + arrow('avg') + '</th></tr></thead><tbody>';
      grows.forEach(function(g, i){
        html += '<tr><td class="rank-num">' + (i + 1) + '</td><td><div class="rank-name">' + (g.name === 'Unspecified' ? '' : groupIcon(col, g.name)) +
          '<span class="val">' + esc(g.name) + '</span></div></td><td class="rank-count">' + g.count + '</td>' +
          '<td class="rank-total">' + esc(fmtNumber(g.total)) + '</td><td class="rank-avg">' + (g.avg == null ? '\u2014' : esc(fmtVal(g.avg))) + '</td></tr>';
      });
      html += '</tbody></table>';
    }
    body.innerHTML = html;
  }

  function openRankings(){
    if (!table) return;
    rankingsState.open = true;
    $('rankings-overlay').style.display = 'flex';
    var di = $('rankings-date');
    di.max = todayStr();
    di.value = rankingsState.dateStr || todayStr();
    renderRankings();
  }
  function closeRankings(){
    rankingsState.open = false;
    $('rankings-overlay').style.display = 'none';
  }

  /* ================= trends (line chart) ================= */
  var TREND_COLORS = ['#2F7A4D', '#3B6FD4', '#D9822B', '#A855A8', '#C0392B', '#0E9AA7', '#8A6D1F', '#6B7280'];
  var TREND_MAX_SERIES = 8;

  /* All snapshots across the table, oldest first. Built once per data change and shared by every line. */
  var eventsCache = {key: null, events: null};
  function allEvents(){
    var key = tableToken + '|' + dataVersion;
    if (eventsCache.key === key) return eventsCache.events;
    var ev = [];
    Object.keys(table.history).forEach(function(id){
      var arr = table.history[id];
      for (var i = 0; i < arr.length; i++) ev.push({t: arr[i].t, id: id, i: i});
    });
    ev.sort(function(a, b){ return a.t - b.t; });
    eventsCache = {key: key, events: ev};
    return ev;
  }

  /* One line for a single row: walk its own snapshots once. */
  function rowSeriesPoints(s, from, to){
    var arr = table.history[s.key] || [];
    var cur = null, i = 0, n = arr.length;
    function val(sn){ return sn.del ? null : sn.m; }
    while (i < n && arr[i].t <= from){ cur = val(arr[i]); i++; }
    var pts = [{t: from, v: cur, edge: true}];
    while (i < n && arr[i].t < to){
      var b = Math.floor(arr[i].t / 60000);
      while (i < n && arr[i].t < to && Math.floor(arr[i].t / 60000) === b){ cur = val(arr[i]); i++; }
      if (cur !== pts[pts.length - 1].v) pts.push({t: Math.min((b + 1) * 60000 - 1, to - 1), v: cur, edge: false});
    }
    pts.push({t: to, v: cur, edge: true});
    return pts;
  }

  /* One line for a category: sweep through all snapshots once, keeping a running total. */
  function groupSeriesPoints(s, from, to){
    var events = allEvents(), kind = s.kind, key = s.key;
    var contrib = {}, sum = 0, count = 0;
    function apply(e){
      var sn = table.history[e.id][e.i];
      if (contrib[e.id] !== undefined){ sum -= contrib[e.id]; count--; delete contrib[e.id]; }
      if (!sn.del && sn.m != null && sn.g && sn.g[kind] === key){ contrib[e.id] = sn.m; sum += sn.m; count++; }
    }
    function value(){ return count ? (trendState.metric === 'avg' ? sum / count : sum) : null; }
    var i = 0, n = events.length;
    while (i < n && events[i].t <= from){ apply(events[i]); i++; }
    var pts = [{t: from, v: value(), edge: true}];
    while (i < n && events[i].t < to){
      var b = Math.floor(events[i].t / 60000);
      while (i < n && events[i].t < to && Math.floor(events[i].t / 60000) === b){ apply(events[i]); i++; }
      var v = value();
      if (v !== pts[pts.length - 1].v) pts.push({t: Math.min((b + 1) * 60000 - 1, to - 1), v: v, edge: false});
    }
    pts.push({t: to, v: value(), edge: true});
    return pts;
  }

  function seriesPoints(s, from, to){
    return s.kind === 'row' ? rowSeriesPoints(s, from, to) : groupSeriesPoints(s, from, to);
  }

  /* the value of a line at time T, read from its precomputed points (no re-scanning the history) */
  function valueFromPts(pts, T){
    var lo = 0, hi = pts.length - 1, ans = 0;
    while (lo <= hi){
      var mid = (lo + hi) >> 1;
      if (pts[mid].t <= T){ ans = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    return pts[ans].v;
  }

  function niceNum(range, round){
    var exp = Math.floor(Math.log(range) / Math.LN10);
    var f = range / Math.pow(10, exp);
    var nf;
    if (round) nf = f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10;
    else nf = f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10;
    return nf * Math.pow(10, exp);
  }

  function niceScale(lo, hi, count){
    var range = niceNum(hi - lo, false);
    var step = niceNum(range / (count - 1), true);
    var min = Math.floor(lo / step) * step;
    var max = Math.ceil(hi / step) * step;
    var ticks = [];
    for (var v = min; v <= max + step / 2; v += step) ticks.push(parseFloat(v.toFixed(6)));
    return {min: min, max: max, ticks: ticks};
  }

  function fmtVal(v){
    if (v == null) return '—';
    if (Math.abs(v) >= 100) return Math.round(v).toLocaleString('en-US');
    return (Math.round(v * 10) / 10).toLocaleString('en-US', {maximumFractionDigits: 1});
  }

  function timeTicks(from, to){
    var MIN = 60000, H1 = 3600000, D1 = 86400000;
    var span = to - from;
    var steps = [5 * MIN, 15 * MIN, 30 * MIN, H1, 3 * H1, 6 * H1, 12 * H1, D1, 2 * D1, 7 * D1, 14 * D1, 30 * D1, 91 * D1, 182 * D1, 365 * D1];
    var step = steps[steps.length - 1];
    for (var i = 0; i < steps.length; i++){
      if (span / steps[i] <= 7){ step = steps[i]; break; }
    }
    var ticks = [];
    if (step < D1){
      var hs = new Date(from);
      hs.setMinutes(0, 0, 0);
      var t = hs.getTime() + Math.ceil((from - hs.getTime()) / step) * step;
      for (; t <= to; t += step) ticks.push(t);
    } else {
      var d = new Date(from);
      d.setHours(0, 0, 0, 0);
      if (d.getTime() < from) d.setDate(d.getDate() + 1);
      var stepDays = Math.round(step / D1);
      while (d.getTime() <= to){
        ticks.push(d.getTime());
        d.setDate(d.getDate() + stepDays);
      }
    }
    return {ticks: ticks, step: step};
  }

  function fmtTick(t, step, span){
    var d = new Date(t);
    if (step < 86400000){
      var tm = d.toLocaleTimeString('en-US', {hour: 'numeric', minute: '2-digit'});
      if (span > 36 * 3600000) return d.toLocaleDateString('en-US', {month: 'short', day: 'numeric'}) + ', ' + tm;
      return tm;
    }
    if (step >= 30 * 86400000) return d.toLocaleDateString('en-US', {month: 'short', year: 'numeric'});
    return d.toLocaleDateString('en-US', {month: 'short', day: 'numeric'});
  }


  function trendKinds(){
    var k = [{value: 'row', label: 'Row'}];
    groupableCols().forEach(function(c){ k.push({value: c.id, label: c.name}); });
    return k;
  }
  function trendKindLabel(kind){
    if (kind === 'row') return 'Row';
    var c = colById(kind);
    return c ? c.name : 'Group';
  }

  function trendOptions(kind){
    var opts = [];
    if (kind === 'row'){
      var counts = {};
      table.rows.forEach(function(r){ var l = rowLabel(r); counts[l] = (counts[l] || 0) + 1; });
      var seen = {};
      table.rows.forEach(function(r){
        var l = rowLabel(r);
        var label = l;
        if (counts[l] > 1){ seen[l] = (seen[l] || 0) + 1; label = l + ' (' + seen[l] + ')'; }
        opts.push({key: r.id, label: label});
      });
    } else {
      var col = colById(kind);
      if (col) uniqueGroupKeys(col).forEach(function(k){ opts.push({key: k, label: k}); });
    }
    opts.sort(function(a, b){ return a.label.localeCompare(b.label); });
    return opts;
  }

  function refreshTrendOptions(){
    var kinds = trendKinds();
    if (!kinds.some(function(k){ return k.value === trendState.kind; })) trendState.kind = 'row';
    $('trend-type').innerHTML = kinds.map(function(k){
      return '<option value="' + esc(k.value) + '"' + (k.value === trendState.kind ? ' selected' : '') + '>' + esc(k.label) + '</option>';
    }).join('');
    $('trend-entity-list').innerHTML = trendOptions(trendState.kind).map(function(o){ return '<option value="' + esc(o.label) + '"></option>'; }).join('');
    $('trend-entity-input').placeholder = 'Search ' + trendKindLabel(trendState.kind).toLowerCase() + '\u2026';
  }

  function setTrendMsg(msg){ $('trend-msg').textContent = msg || ''; }

  function addTrendSeries(){
    var input = $('trend-entity-input');
    var text = input.value.trim().toLowerCase();
    if (!text){ setTrendMsg('Type a name and pick it from the list.'); return; }
    var opt = trendOptions(trendState.kind).find(function(o){ return o.label.toLowerCase() === text; });
    if (!opt){ setTrendMsg('Nothing called that in this table.'); return; }
    var dup = trendState.series.some(function(s){ return s.kind === trendState.kind && s.key === opt.key; });
    if (dup){ setTrendMsg('Already on the chart.'); return; }
    if (trendState.series.length >= TREND_MAX_SERIES){ setTrendMsg('Up to ' + TREND_MAX_SERIES + ' lines at a time.'); return; }
    var used = trendState.series.map(function(s){ return s.color; });
    var color = TREND_COLORS.find(function(c){ return used.indexOf(c) === -1; }) || TREND_COLORS[0];
    trendState.series.push({kind: trendState.kind, key: opt.key, label: opt.label, color: color});
    input.value = '';
    setTrendMsg('');
    renderTrends();
  }

  function trendRange(){
    var from = new Date(trendState.fromStr + 'T00:00:00').getTime();
    var to = trendState.toStr >= todayStr() ? Date.now() : new Date(trendState.toStr + 'T23:59:59.999').getTime();
    return {from: from, to: to};
  }

  function applyTrendPreset(days){
    trendState.toStr = todayStr();
    if (days > 0){
      trendState.fromStr = dateToStr(new Date(Date.now() - days * 86400000));
      trendState.preset = String(days);
    } else {
      trendState.fromStr = dateToStr(new Date(earliestHistoryMs()));
      trendState.preset = 'all';
    }
  }

  function syncTrendControls(){
    $('trend-from').value = trendState.fromStr;
    $('trend-to').value = trendState.toStr;
    Array.prototype.forEach.call(document.querySelectorAll('#trend-presets button'), function(b){
      var key = b.getAttribute('data-days') === '0' ? 'all' : b.getAttribute('data-days');
      b.classList.toggle('active', key === trendState.preset);
    });
    Array.prototype.forEach.call(document.querySelectorAll('#trend-metric button'), function(b){
      b.classList.toggle('active', b.getAttribute('data-metric') === trendState.metric);
    });
    $('trend-zero').checked = trendState.zero;
  }

  function renderTrendChips(){
    $('trend-chips').innerHTML = trendState.series.map(function(s, i){
      var icon = '';
      if (s.kind !== 'row'){ var c = colById(s.kind); if (c) icon = groupIcon(c, s.key); }
      return '<span class="trend-chip" style="--chip:' + s.color + ';"><span class="trend-swatch"></span>' + icon +
        '<span class="val">' + esc(s.label) + '</span><span class="trend-chip-type">' + esc(trendKindLabel(s.kind)) + '</span>' +
        '<button class="trend-chip-x" data-idx="' + i + '" aria-label="Remove from chart" title="Remove">&times;</button></span>';
    }).join('');
  }

  function renderTrends(){
    renderTrendChips();
    var chart = $('trend-chart');
    var note = $('trend-note');
    if (!table.metricId){
      chart.innerHTML = '<div class="rank-empty">Trends need a number column to chart.<br>Open a number column\u2019s menu and choose \u201CUse for rankings &amp; trends\u201D.</div>';
      note.textContent = '';
      return;
    }
    if (!trendState.series.length){
      chart.innerHTML = '<div class="rank-empty">Add a row or a category above to chart its ' + esc(metricName().toLowerCase()) + ' over time. Add more to compare.</div>';
      note.textContent = '';
      return;
    }
    if (trendState.fromStr > trendState.toStr){
      chart.innerHTML = '<div class="rank-empty">The start date needs to be on or before the end date.</div>';
      note.textContent = '';
      return;
    }
    var range = trendRange();
    var from = range.from, to = range.to;
    if (to - from < 60000) to = from + 60000;

    var data = trendState.series.map(function(s){ return {s: s, pts: seriesPoints(s, from, to)}; });
    var vals = [], eventCount = 0;
    data.forEach(function(d){
      d.pts.forEach(function(p){
        if (p.v != null) vals.push(p.v);
        if (!p.edge) eventCount++;
      });
    });
    if (!vals.length){
      chart.innerHTML = '<div class="rank-empty">No history in this date range yet.</div>';
      note.textContent = 'History is recorded from the moment values are edited or rows are added, so earlier dates are empty.';
      return;
    }
    var minV = Math.min.apply(null, vals), lo = minV, hi = Math.max.apply(null, vals);
    if (trendState.zero) lo = Math.min(0, lo);
    if (hi === lo){
      hi += 1;
      if (!trendState.zero) lo -= 1;
    } else if (!trendState.zero){
      var pad = (hi - lo) * 0.08;
      lo -= pad; hi += pad;
    }
    if (minV >= 0) lo = Math.max(0, lo);
    var scale = niceScale(lo, hi, 5);
    var yMin = scale.min, yMax = scale.max;

    var W = 900, H = 380, ml = 60, mr = 22, mt = 16, mb = 36;
    var pw = W - ml - mr, ph = H - mt - mb;
    function X(t){ return ml + (t - from) / (to - from) * pw; }
    function Y(v){ return mt + (1 - (v - yMin) / (yMax - yMin)) * ph; }

    var svg = '<svg id="trend-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Trends over time">';
    scale.ticks.forEach(function(v){
      var y = Y(v).toFixed(1);
      svg += '<line x1="' + ml + '" x2="' + (W - mr) + '" y1="' + y + '" y2="' + y + '" stroke="var(--border)" stroke-width="1"/>';
      svg += '<text class="trend-axis-text" x="' + (ml - 8) + '" y="' + (+y + 4) + '" text-anchor="end">' + esc(fmtVal(v)) + '</text>';
    });
    var tt = timeTicks(from, to);
    tt.ticks.forEach(function(t){
      var x = X(t).toFixed(1);
      svg += '<line x1="' + x + '" x2="' + x + '" y1="' + (H - mb) + '" y2="' + (H - mb + 4) + '" stroke="var(--border-strong)"/>';
      svg += '<text class="trend-axis-text" x="' + x + '" y="' + (H - mb + 18) + '" text-anchor="middle">' + esc(fmtTick(t, tt.step, to - from)) + '</text>';
    });
    svg += '<line x1="' + ml + '" x2="' + (W - mr) + '" y1="' + (H - mb) + '" y2="' + (H - mb) + '" stroke="var(--border-strong)"/>';

    data.forEach(function(d){
      var path = '', open = false, firstDot = true, dots = '';
      d.pts.forEach(function(p){
        if (p.v == null){
          if (open){ path += 'H' + X(p.t).toFixed(1); open = false; }
          return;
        }
        var x = X(p.t).toFixed(1), y = Y(p.v).toFixed(1);
        if (!open){ path += 'M' + x + ' ' + y; open = true; } else { path += 'H' + x + 'V' + y; }
        if (!p.edge || firstDot){
          dots += '<circle cx="' + x + '" cy="' + y + '" r="3.2" fill="' + d.s.color + '" stroke="#fff" stroke-width="1.2"/>';
        }
        firstDot = false;
      });
      svg += '<path d="' + path + '" fill="none" stroke="' + d.s.color + '" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>' + dots;
    });

    svg += '<g id="trend-hover" style="display:none;pointer-events:none;"><line id="trend-hover-line" y1="' + mt + '" y2="' + (H - mb) + '" stroke="var(--text-faint)" stroke-dasharray="3 3"/>';
    data.forEach(function(d, i){
      svg += '<circle id="trend-hover-dot-' + i + '" r="4.5" fill="' + d.s.color + '" stroke="#fff" stroke-width="1.5" style="display:none;"/>';
    });
    svg += '</g><rect id="trend-hit" x="' + ml + '" y="' + mt + '" width="' + pw + '" height="' + ph + '" fill="transparent"/></svg><div class="trend-tip" id="trend-tip"></div>';
    chart.innerHTML = svg;

    var hasGroup = trendState.series.some(function(s){ return s.kind !== 'row'; });
    note.textContent = (hasGroup ? ('Categories show the ' + (trendState.metric === 'avg' ? 'average' : 'total') + ' of ' + metricName() + ' across their rows at each moment. ') : '') +
      (eventCount === 0 ? 'Nothing has changed in this range yet \u2014 lines will start moving as you edit values.' : 'Hover the chart to compare values at any moment.');

    var svgEl = $('trend-svg'), hit = $('trend-hit'), hv = $('trend-hover'), hline = $('trend-hover-line'), tip = $('trend-tip');
    function hide(){ hv.style.display = 'none'; tip.style.display = 'none'; }
    hit.addEventListener('pointerleave', hide);
    hit.addEventListener('pointermove', function(e){
      var rect = svgEl.getBoundingClientRect();
      var sx = (e.clientX - rect.left) * (W / rect.width);
      var frac = Math.max(0, Math.min(1, (sx - ml) / pw));
      var T = from + frac * (to - from);
      var hx = X(T).toFixed(1);
      hline.setAttribute('x1', hx); hline.setAttribute('x2', hx);
      hv.style.display = 'block';
      var rows = '';
      data.forEach(function(d, i){
        var v = valueFromPts(d.pts, T);
        var dot = $('trend-hover-dot-' + i);
        if (v == null){ dot.style.display = 'none'; }
        else { dot.setAttribute('cx', hx); dot.setAttribute('cy', Y(v).toFixed(1)); dot.style.display = 'block'; }
        rows += '<div class="tt-row"><span class="trend-swatch" style="--chip:' + d.s.color + ';"></span><span class="tt-name">' + esc(d.s.label) + '</span><span class="tt-num">' + esc(fmtVal(v)) + '</span></div>';
      });
      tip.innerHTML = '<div class="tt-time">' + esc(new Date(T).toLocaleString('en-US', {month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit'})) + '</div>' + rows;
      tip.style.display = 'block';
      var cRect = chart.getBoundingClientRect();
      var left = e.clientX - cRect.left + 16;
      if (left + tip.offsetWidth > cRect.width) left = e.clientX - cRect.left - tip.offsetWidth - 16;
      var top = e.clientY - cRect.top - tip.offsetHeight / 2;
      top = Math.max(0, Math.min(top, cRect.height - tip.offsetHeight));
      tip.style.left = Math.max(0, left) + 'px';
      tip.style.top = top + 'px';
    });
  }

  function openTrends(){
    if (!table) return;
    trendState.open = true;
    $('trends-overlay').style.display = 'flex';
    var today = todayStr();
    $('trend-from').max = today; $('trend-to').max = today;
    if (!trendState.fromStr || !trendState.toStr) applyTrendPreset(0);
    else if (trendState.toStr > today) trendState.toStr = today;
    setTrendMsg('');
    refreshTrendOptions();
    syncTrendControls();
    renderTrends();
  }
  function closeTrends(){
    trendState.open = false;
    $('trends-overlay').style.display = 'none';
  }

  /* ================= tables (switcher, create, rename, delete) ================= */
  function currentTableName(){
    var t = tables.find(function(x){ return x.id === currentTableId; });
    return t ? t.name : 'Table';
  }

  function resetViewForTable(){
    view = {sortColId: '', sortDir: 'desc', groupColId: '', filterValue: 'all', query: '', collapsed: {}};
    $('search-input').value = '';
    $('clear-search-btn').style.display = 'none';
    rankingsState.tab = 'row'; rankingsState.sortField = 'm'; rankingsState.sortDir = 'desc'; rankingsState.dateStr = '';
    trendState.series = []; trendState.fromStr = ''; trendState.toStr = ''; trendState.preset = 'all'; trendState.kind = 'row';
    closePopover();
  }

  function enterTable(id){
    table = null;
    $('table-card').innerHTML = '<div class="empty-state"><h3>Loading\u2026</h3></div>';
    resetViewForTable();
    return loadTable(id).then(function(t){
      table = t;
      afterLoad();
      render();
    });
  }

  function switchTable(id){
    closeTableMenu();
    if (id === currentTableId) return;
    flushSave().then(function(){
      currentTableId = id;
      saveMeta();
      enterTable(id);
    });
  }

  function addTableFromData(name, data, imagesMap){
    return flushSave().then(function(){
      if (imagesMap){
        Object.keys(imagesMap).forEach(function(id){
          if (isImageId(id) && isDataImage(imagesMap[id])) imageData[id] = imagesMap[id];
        });
      }
      return internInlineImages(normalizeTable(data));
    }).then(function(t){
      var id = newTableId();
      return writeBatchChain(fullPuts(id, t), []).then(function(){
        tables.push({id: id, name: name, createdAt: Date.now()});
        currentTableId = id;
        return saveMeta();
      }).then(function(){ return enterTable(id); });
    });
  }

  var TEMPLATES = [
    {id: 'blank', name: 'Blank table', desc: 'One text column. Add whatever you need.'},
    {id: 'footballer', name: 'Footballer roster', desc: 'Name, nationality, club, position, birthday, height and score.'},
    {id: 'books', name: 'Reading list', desc: 'Title, author, status, genres, rating, date, owned and cover.'}
  ];

  function openNewTableDialog(){
    closeTableMenu();
    var body = openDialog('New table', false);
    body.onclick = null; body.oninput = null;
    var chosen = 'blank';
    body.innerHTML = '<label class="dlg-label" for="nt-name">Name</label><input class="pop-input" id="nt-name" placeholder="e.g. Reading list" autocomplete="off">' +
      '<div class="dlg-label">Start from</div><div class="tpl-list" id="nt-tpl">' + TEMPLATES.map(function(t){
        return '<button class="tpl-card' + (t.id === chosen ? ' active' : '') + '" data-tpl="' + t.id + '"><strong>' + esc(t.name) + '</strong><span>' + esc(t.desc) + '</span></button>';
      }).join('') + '</div><div class="dlg-actions"><button class="btn" id="nt-cancel">Cancel</button><button class="btn btn-primary" id="nt-create">Create table</button></div>';
    $('nt-name').focus();
    function create(){
      var tpl = TEMPLATES.find(function(t){ return t.id === chosen; });
      var name = $('nt-name').value.trim() || (chosen === 'blank' ? 'Untitled table' : tpl.name);
      closeDialog();
      addTableFromData(name, makeTemplate(chosen));
    }
    body.onclick = function(e){
      var card = e.target.closest('.tpl-card');
      if (card){
        chosen = card.getAttribute('data-tpl');
        Array.prototype.forEach.call(body.querySelectorAll('.tpl-card'), function(c){ c.classList.toggle('active', c === card); });
        return;
      }
      if (e.target.closest('#nt-cancel')) closeDialog();
      if (e.target.closest('#nt-create')) create();
    };
    $('nt-name').addEventListener('keydown', function(e){ if (e.key === 'Enter') create(); });
  }

  function renameCurrentTable(){
    var t = tables.find(function(x){ return x.id === currentTableId; });
    if (!t) return;
    var name = prompt('Rename this table:', t.name);
    if (name === null) return;
    name = name.trim();
    if (!name) return;
    t.name = name;
    saveMeta();
    updateTableTitle();
    closeTableMenu();
  }

  function deleteCurrentTable(){
    if (tables.length <= 1){ alert('You need at least one table \u2014 create another before deleting this one.'); return; }
    var t = tables.find(function(x){ return x.id === currentTableId; });
    if (!t) return;
    if (!confirm('Delete \u201C' + t.name + '\u201D and its ' + table.rows.length + ' rows? This cannot be undone.')) return;
    var gone = currentTableId, goneTable = table;
    tables = tables.filter(function(x){ return x.id !== gone; });
    clearTimeout(saveTimer);
    dirty = freshDirty();
    writeBatchChain([], allKeysOf(gone, goneTable));
    currentTableId = tables[0].id;
    saveMeta();
    closeTableMenu();
    enterTable(currentTableId);
  }

  function renderTableMenu(){
    var menu = $('table-menu');
    var check = '<svg class="roster-menu-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    var html = '<div class="roster-menu-list">';
    tables.forEach(function(t){
      var active = t.id === currentTableId;
      html += '<button class="roster-menu-item' + (active ? ' active' : '') + '" data-table-id="' + esc(t.id) + '">' +
        (active ? check : '<span class="roster-menu-spacer"></span>') + '<span class="val">' + esc(t.name) + '</span></button>';
    });
    html += '</div><div class="roster-menu-divider"></div>' +
      '<button class="roster-menu-action" id="tm-new">+ New table</button>' +
      '<button class="roster-menu-action" id="tm-rename">Rename this table</button>' +
      '<button class="roster-menu-action roster-menu-danger" id="tm-delete"' + (tables.length <= 1 ? ' disabled' : '') + '>Delete this table</button>';
    menu.innerHTML = html;
    Array.prototype.forEach.call(menu.querySelectorAll('.roster-menu-item'), function(b){
      b.addEventListener('click', function(){ switchTable(b.getAttribute('data-table-id')); });
    });
    $('tm-new').addEventListener('click', openNewTableDialog);
    $('tm-rename').addEventListener('click', renameCurrentTable);
    $('tm-delete').addEventListener('click', deleteCurrentTable);
  }
  function openTableMenu(){ tableMenuOpen = true; renderTableMenu(); $('table-menu').style.display = 'block'; }
  function closeTableMenu(){ tableMenuOpen = false; $('table-menu').style.display = 'none'; }

  /* ================= import / export ================= */
  function downloadFile(filename, text, mime){
    var blob = new Blob([text], {type: mime});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function safeFileName(s){ return String(s).replace(/[^\w\-]+/g, '_').replace(/^_+|_+$/g, '') || 'table'; }

  function exportJson(){
    if (!table) return;
    var refs = referencedImages(table), images = {};
    Object.keys(refs).forEach(function(id){ if (imageData[id]) images[id] = imageData[id]; });
    var data = {
      format: 'tables-app', version: 2, name: currentTableName(),
      table: {columns: table.columns, rows: table.rows, primaryId: table.primaryId, metricId: table.metricId, history: table.history},
      images: images
    };
    downloadFile(safeFileName(currentTableName()) + '-' + todayStr() + '.json', JSON.stringify(data, null, 2), 'application/json');
  }

  function exportCsv(){
    function q(s){ s = String(s == null ? '' : s); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
    var lines = [table.columns.map(function(c){ return q(c.name); }).join(',')];
    table.rows.forEach(function(r){
      lines.push(table.columns.map(function(c){
        if (c.type === 'image') return q(r.c[c.id] ? '(image)' : '');
        if (c.type === 'checkbox') return q(r.c[c.id] === true ? 'TRUE' : 'FALSE');
        return q(cellText(r, c));
      }).join(','));
    });
    downloadFile(safeFileName(currentTableName()) + '-' + todayStr() + '.csv', '\uFEFF' + lines.join('\r\n'), 'text/csv;charset=utf-8');
  }

  function openExportMenu(anchor){
    var pop = openPopover(anchor, '<button class="pop-item" data-act="json">Table backup (.json)<span class="pop-sub">Everything, incl. images &amp; history</span></button>' +
      '<button class="pop-item" data-act="csv">Spreadsheet (.csv)<span class="pop-sub">Values only</span></button>');
    pop.onclick = function(e){
      var b = e.target.closest('.pop-item');
      if (!b) return;
      closePopover();
      if (b.getAttribute('data-act') === 'json') exportJson(); else exportCsv();
    };
  }

  function onImportFile(e){
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(evt){
      try {
        var parsed = JSON.parse(evt.target.result);
        if (parsed && parsed.format === 'tables-app' && parsed.table){
          addTableFromData(parsed.name || 'Imported table', parsed.table, parsed.images);
        } else if (Array.isArray(parsed) || (parsed && Array.isArray(parsed.players))){
          addTableFromData('Footballer roster (imported)', legacyToTable(parsed));
        } else {
          throw new Error('This file isn\u2019t a table backup from this app or an export from the footballer roster app.');
        }
      } catch (err){
        alert('Could not import this file: ' + err.message);
      } finally {
        e.target.value = '';
      }
    };
    reader.readAsText(file);
  }

  /* ================= wiring ================= */
  var suppressClickUntil = 0;
  function startColumnResize(e){
    var handle = e.target.closest('.col-resize');
    if (!handle || (e.button != null && e.button !== 0)) return;
    var col = colById(handle.getAttribute('data-resize'));
    if (!col) return;
    e.preventDefault();
    e.stopPropagation();
    closePopover();
    var colEl = document.querySelectorAll('#table-card colgroup col')[table.columns.indexOf(col)];
    var startX = e.clientX, startW = colWidth(col), moved = false;
    handle.classList.add('active');
    document.body.classList.add('resizing');
    function move(ev){
      var w = Math.max(MIN_COL_W, Math.min(MAX_COL_W, Math.round(startW + ev.clientX - startX)));
      if (w === col.width) return;
      col.width = w;
      moved = true;
      if (colEl) colEl.style.width = w + 'px';
    }
    function up(){
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      document.removeEventListener('pointercancel', up);
      handle.classList.remove('active');
      document.body.classList.remove('resizing');
      suppressClickUntil = Date.now() + 300;
      if (moved) scheduleSave();
    }
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
    document.addEventListener('pointercancel', up);
  }

  function wire(){
    $('table-card').addEventListener('pointerdown', startColumnResize);
    $('table-card').addEventListener('dblclick', function(e){
      var handle = e.target.closest('.col-resize');
      if (!handle) return;
      var col = colById(handle.getAttribute('data-resize'));
      if (!col || col.width == null) return;
      delete col.width;
      scheduleSave();
      render();
    });
    $('table-card').addEventListener('click', function(e){
      if (e.target.closest('.col-resize') || Date.now() < suppressClickUntil) return;
      var th = e.target.closest('th.col-th');
      if (th){ var c = colById(th.getAttribute('data-col')); if (c) openColumnMenu(th, c); return; }
      if (e.target.closest('#add-col-th')){ openAddColumn($('add-col-th')); return; }
      if (e.target.closest('#add-row-trigger')){ addRow(); return; }
      onTbodyClick(e);
    });
    $('add-row-btn').addEventListener('click', addRow);
    $('image-input').addEventListener('change', onImageChosen);
    $('import-input').addEventListener('change', onImportFile);
    $('import-btn').addEventListener('click', function(){ $('import-input').click(); });
    $('export-btn').addEventListener('click', function(e){ e.stopPropagation(); openExportMenu($('export-btn')); });

    $('group-select').addEventListener('change', function(e){
      view.groupColId = e.target.value; view.filterValue = 'all'; view.collapsed = {}; render();
    });
    $('filter-select').addEventListener('change', function(e){ view.filterValue = e.target.value; render(); });
    var searchTimer = null;
    $('search-input').addEventListener('input', function(e){
      view.query = e.target.value;
      $('clear-search-btn').style.display = view.query ? 'inline-flex' : 'none';
      clearTimeout(searchTimer);
      searchTimer = setTimeout(render, 160);
    });
    $('clear-search-btn').addEventListener('click', function(){
      view.query = ''; $('search-input').value = ''; $('clear-search-btn').style.display = 'none'; render();
    });

    $('table-switcher-btn').addEventListener('click', function(e){ e.stopPropagation(); if (tableMenuOpen) closeTableMenu(); else openTableMenu(); });

    $('rankings-btn').addEventListener('click', openRankings);
    $('rankings-close').addEventListener('click', closeRankings);
    $('rankings-overlay').addEventListener('click', function(e){ if (e.target === this) closeRankings(); });
    $('rankings-tabs').addEventListener('click', function(e){
      var b = e.target.closest('.modal-tab');
      if (!b) return;
      rankingsState.tab = b.getAttribute('data-tab');
      rankingsState.sortField = rankingsState.tab === 'row' ? 'm' : 'total';
      rankingsState.sortDir = 'desc';
      renderRankings();
    });
    $('rankings-body').addEventListener('click', function(e){
      var th = e.target.closest('th[data-sort]');
      if (!th) return;
      var f = th.getAttribute('data-sort');
      if (rankingsState.sortField === f) rankingsState.sortDir = rankingsState.sortDir === 'desc' ? 'asc' : 'desc';
      else { rankingsState.sortField = f; rankingsState.sortDir = f === 'label' ? 'asc' : 'desc'; }
      renderRankings();
    });
    $('rankings-date').addEventListener('change', function(e){ rankingsState.dateStr = e.target.value; renderRankings(); });
    $('rankings-date-live').addEventListener('click', function(){ rankingsState.dateStr = ''; $('rankings-date').value = todayStr(); renderRankings(); });

    $('trends-btn').addEventListener('click', openTrends);
    $('trends-close').addEventListener('click', closeTrends);
    $('trends-overlay').addEventListener('click', function(e){ if (e.target === this) closeTrends(); });
    $('trend-type').addEventListener('change', function(e){
      trendState.kind = e.target.value;
      $('trend-entity-input').value = '';
      setTrendMsg('');
      refreshTrendOptions();
    });
    $('trend-add-btn').addEventListener('click', addTrendSeries);
    $('trend-entity-input').addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); addTrendSeries(); } });
    $('trend-chips').addEventListener('click', function(e){
      var btn = e.target.closest('.trend-chip-x');
      if (!btn) return;
      trendState.series.splice(+btn.getAttribute('data-idx'), 1);
      renderTrends();
    });
    $('trend-presets').addEventListener('click', function(e){
      var btn = e.target.closest('button');
      if (!btn) return;
      applyTrendPreset(+btn.getAttribute('data-days'));
      syncTrendControls(); renderTrends();
    });
    function onTrendDate(){
      var f = $('trend-from').value, t = $('trend-to').value;
      if (f) trendState.fromStr = f;
      if (t) trendState.toStr = t;
      trendState.preset = 'custom';
      syncTrendControls(); renderTrends();
    }
    $('trend-from').addEventListener('change', onTrendDate);
    $('trend-to').addEventListener('change', onTrendDate);
    $('trend-metric').addEventListener('click', function(e){
      var btn = e.target.closest('button');
      if (!btn) return;
      trendState.metric = btn.getAttribute('data-metric');
      syncTrendControls(); renderTrends();
    });
    $('trend-zero').addEventListener('change', function(e){ trendState.zero = e.target.checked; renderTrends(); });

    $('dlg-close').addEventListener('click', closeDialog);
    $('dlg-overlay').addEventListener('click', function(e){ if (e.target === this) closeDialog(); });

    document.addEventListener('mousedown', function(e){
      if (popoverOpen() && !$('popover').contains(e.target)) closePopover();
    });
    document.addEventListener('click', function(e){
      if (tableMenuOpen && !$('table-menu').contains(e.target) && !$('table-switcher-btn').contains(e.target)) closeTableMenu();
    });
    window.addEventListener('scroll', function(e){
      if (popoverOpen() && !$('popover').contains(e.target)) closePopover();
    }, true);
    document.addEventListener('keydown', function(e){
      if (e.key !== 'Escape') return;
      if (popoverOpen()){ closePopover(); return; }
      if (dialogOpen()){ closeDialog(); return; }
      if (trendState.open) closeTrends();
      if (rankingsState.open) closeRankings();
      if (tableMenuOpen) closeTableMenu();
    });
    window.addEventListener('scroll', onScrollOrResize, {passive: true});
    window.addEventListener('resize', onScrollOrResize);
    window.addEventListener('pagehide', function(){ if (dirty.any) saveTableNow(); });
    document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'hidden') flushSave(); });
  }

  /* ================= init ================= */
  wire();
  $('table-card').innerHTML = '<div class="empty-state"><h3>Loading\u2026</h3></div>';
  loadMetaOrCreateDefault().then(function(){
    return table || loadTable(currentTableId);
  }).then(function(t){
    table = t;
    afterLoad();
    render();
  });

})();
</script>
</body>
</html>
