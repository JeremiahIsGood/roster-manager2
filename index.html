<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tables</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css">
<style>
  :root{
    --bg:#FFFFFF;
    --bg-hover:#F7F6F3;
    --bg-app:#FBFAF8;
    --border:#E9E7E1;
    --border-strong:#DAD7CE;
    --text:#37352F;
    --text-secondary:#8F8C82;
    --text-faint:#B8B5AB;
    --accent:#2F7A4D;
    --accent-dark:#1F5636;
    --accent-light:#E7F2EC;
    --danger:#C0392B;
    --danger-light:#FBEAE8;
    --radius:6px;
    --shadow-pop: 0 4px 16px rgba(0,0,0,0.10), 0 1px 2px rgba(0,0,0,0.06);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg-app);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:40px 32px 80px;
  }

  /* ---------- Header ---------- */
  .topbar{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    margin-bottom:28px;
    gap:20px;
    flex-wrap:wrap;
  }
  .roster-switcher{
    position:relative;
    margin-bottom:4px;
  }
  .roster-switcher-btn{
    font-family:'Inter Tight',sans-serif;
    font-size:26px;
    font-weight:700;
    letter-spacing:-0.01em;
    display:flex;
    align-items:center;
    gap:10px;
    background:none;
    border:none;
    padding:2px 4px;
    margin:0 0 -2px -4px;
    color:var(--text);
    cursor:pointer;
    border-radius:6px;
  }
  .roster-switcher-btn:hover{ background:var(--bg-hover); }
  .roster-switcher-btn:hover .roster-chevron{ color:var(--text-secondary); }
  .roster-chevron{
    width:16px;
    height:16px;
    color:var(--text-faint);
    margin-top:3px;
  }
  .title-block .pitch-dot{
    width:10px;height:10px;border-radius:2px;
    background:var(--accent);
    display:inline-block;
    transform:rotate(45deg);
    flex:0 0 auto;
  }
  .title-block p{
    margin:0;
    font-size:13px;
    color:var(--text-secondary);
  }
  .roster-menu{
    position:absolute;
    top:calc(100% + 6px);
    left:0;
    min-width:230px;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:10px;
    box-shadow:var(--shadow-pop);
    padding:6px;
    z-index:150;
  }
  .roster-menu-list{
    max-height:260px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:1px;
  }
  .roster-menu-item{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    padding:8px 9px;
    border-radius:6px;
    font-size:13.5px;
    color:var(--text);
    cursor:pointer;
  }
  .roster-menu-item:hover{ background:var(--bg-hover); }
  .roster-menu-item.active{ color:var(--accent-dark); font-weight:600; }
  .roster-menu-item .val{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .roster-menu-check{
    width:14px;
    height:14px;
    flex:0 0 auto;
    color:var(--accent);
  }
  .roster-menu-spacer{ width:14px; flex:0 0 auto; }
  .roster-menu-divider{
    height:1px;
    background:var(--border);
    margin:6px 2px;
  }
  .roster-menu-action{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    padding:8px 9px;
    border-radius:6px;
    font-size:13px;
    font-weight:500;
    color:var(--text-secondary);
    cursor:pointer;
  }
  .roster-menu-action:hover{ background:var(--bg-hover); color:var(--text); }
  .roster-menu-action.roster-menu-danger{ color:var(--danger); }
  .roster-menu-action.roster-menu-danger:hover{ background:var(--danger-light); }
  .roster-menu-action:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }
  .roster-menu-action:disabled:hover{ background:none; color:var(--text-secondary); }

  .toolbar{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  select, button, input[type=file], input[type=search]{
    font-family:inherit;
    font-size:13px;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:7px 12px;
    border-radius:var(--radius);
    border:1px solid var(--border-strong);
    background:var(--bg);
    color:var(--text);
    cursor:pointer;
    font-weight:500;
    transition:background 0.12s, border-color 0.12s;
    white-space:nowrap;
  }
  .btn:hover{ background:var(--bg-hover); }
  .btn:active{ transform:translateY(1px); }
  .btn-primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .btn-primary:hover{ background:var(--accent-dark); border-color:var(--accent-dark); }
  .btn-ghost{
    border-color:transparent;
    background:transparent;
    color:var(--text-secondary);
  }
  .btn-ghost:hover{ background:var(--bg-hover); color:var(--text); }
  .btn svg{ width:14px; height:14px; flex-shrink:0; }

  select{
    padding:7px 28px 7px 10px;
    border-radius:var(--radius);
    border:1px solid var(--border-strong);
    background:var(--bg) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5L5 6.5L8 3.5" stroke="%238F8C82" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>') no-repeat right 10px center;
    appearance:none;
    -webkit-appearance:none;
    color:var(--text);
    cursor:pointer;
  }
  .search-box{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:0 8px;
    border:1px solid var(--border-strong);
    border-radius:var(--radius);
    background:var(--bg);
    height:32px;
  }
  .search-box svg{
    width:14px;
    height:14px;
    color:var(--text-secondary);
    flex:0 0 auto;
  }
  .search-box input{
    width:150px;
    min-width:0;
    border:none;
    outline:none;
    background:transparent;
    color:var(--text);
    padding:0;
  }
  .search-box input::placeholder{ color:var(--text-faint); }
  .field-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--text-faint);
    font-weight:600;
    margin-right:2px;
  }
  #import-input, #club-emblem-input{ display:none; }

  /* ---------- Table shell ---------- */
  .table-card{
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
  }
  table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
  }

  thead th{
    text-align:left;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    font-weight:600;
    color:var(--text-secondary);
    padding:10px 14px;
    border-bottom:1px solid var(--border);
    background:var(--bg);
    user-select:none;
  }
  thead th.sortable{ cursor:pointer; }
  thead th.sortable:hover{ color:var(--text); }
  thead th .sort-arrow{
    display:inline-block;
    margin-left:4px;
    font-size:10px;
    color:var(--text-faint);
  }
  thead th.active-sort .sort-arrow{ color:var(--accent); }

  tbody tr.player-row{
    border-bottom:1px solid var(--border);
    transition:background 0.1s;
  }
  tbody tr.player-row:hover{ background:var(--bg-hover); }
  tbody tr.player-row:last-child{ border-bottom:none; }

  td{
    padding:0;
    font-size:13.5px;
    vertical-align:middle;
    height:42px;
  }
  .cell{
    display:flex;
    align-items:center;
    height:100%;
    padding:0 14px;
    cursor:text;
    min-width:0;
  }
  .cell span.val{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .cell.empty span.val{ color:var(--text-faint); font-style:italic; }
  .cell input{
    width:100%;
    border:none;
    outline:none;
    background:transparent;
    font-family:inherit;
    font-size:13.5px;
    color:var(--text);
    padding:0;
    height:100%;
  }
  .cell input:focus{ outline:none; }
  .cell select{
    width:100%;
    min-width:0;
    border:none;
    outline:none;
    background-color:transparent;
    padding-left:0;
  }
  .name-cell .val{ font-weight:500; }
  .country-flag.fi{
    width:22px;
    height:15px;
    border-radius:2px;
    box-shadow:0 0 0 1px rgba(0,0,0,0.08);
    background-size:cover;
  }
  .club-emblem{
    width:22px;
    height:22px;
    border-radius:4px;
    object-fit:cover;
    flex:0 0 auto;
    border:1px solid var(--border);
    background:var(--bg-hover);
  }

  /* position tag */
  .tag{
    display:inline-flex;
    align-items:center;
    padding:2px 8px;
    border-radius:4px;
    font-size:12px;
    font-weight:500;
    line-height:1.5;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  /* score bar */
  .score-cell{ padding:0 14px; }
  .score-wrap{
    position:relative;
    height:24px;
    width:100%;
    background:var(--bg-hover);
    border-radius:4px;
    overflow:hidden;
    cursor:text;
  }
  .score-bar{
    position:absolute;
    top:0; left:0; bottom:0;
    background:var(--accent-light);
    border-right:2px solid var(--accent);
    transition:width 0.25s ease;
  }
  .score-num{
    position:relative;
    z-index:1;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    padding:0 8px;
    min-width:42px;
    width:42px;
    margin-left:auto;
    background:linear-gradient(90deg, rgba(255,255,255,0), var(--bg-hover) 38%);
    font-variant-numeric:tabular-nums;
    font-weight:600;
    font-size:12.5px;
    color:var(--accent-dark);
  }
  .score-wrap input{
    position:relative;
    z-index:2;
    height:100%;
    width:100%;
    background:transparent;
    border:none;
    outline:none;
    padding:0 8px;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    color:var(--accent-dark);
    font-family:inherit;
    font-size:12.5px;
  }

  /* delete action */
  .row-actions{
    display:flex;
    align-items:center;
    justify-content:center;
    height:100%;
  }
  .del-btn{
    opacity:0;
    background:none;
    border:none;
    cursor:pointer;
    color:var(--text-faint);
    padding:6px;
    border-radius:4px;
    display:flex;
    transition:opacity 0.1s, color 0.1s, background 0.1s;
  }
  tr.player-row:hover .del-btn{ opacity:1; }
  .del-btn:hover{ color:var(--danger); background:var(--danger-light); }
  .del-btn svg{ width:15px; height:15px; }

  /* add row */
  .add-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:11px 14px;
    color:var(--text-secondary);
    font-size:13.5px;
    cursor:pointer;
    border-top:1px solid var(--border);
    transition:background 0.1s, color 0.1s;
  }
  .add-row:hover{ background:var(--bg-hover); color:var(--text); }
  .add-row svg{ width:15px; height:15px; }

  /* group headers */
  tr.group-row td{
    padding:0;
    height:auto;
  }
  .group-header{
    display:flex;
    align-items:center;
    gap:8px;
    padding:14px 14px 8px;
    cursor:pointer;
    user-select:none;
  }
  .group-header .chev{
    width:14px;height:14px;
    color:var(--text-faint);
    transition:transform 0.15s;
    flex-shrink:0;
  }
  .group-header.collapsed .chev{ transform:rotate(-90deg); }
  .group-header .gname{
    font-size:13px;
    font-weight:600;
    color:var(--text);
  }
  .group-header .gcount{
    font-size:12px;
    color:var(--text-faint);
    font-weight:500;
  }
  tr.group-row:first-child .group-header{ padding-top:10px; }

  /* empty state */
  .empty-state{
    text-align:center;
    padding:64px 20px;
  }
  .empty-state h3{
    font-size:15px;
    font-weight:600;
    margin:0 0 6px;
    color:var(--text);
  }
  .empty-state p{
    font-size:13px;
    color:var(--text-secondary);
    margin:0 0 18px;
  }

  .hint-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:10px;
    font-size:12px;
    color:var(--text-faint);
    padding:0 2px;
  }
  .warning-bar{
    display:none;
    align-items:flex-start;
    gap:8px;
    margin:0 0 12px;
    padding:10px 12px;
    border:1px solid #F1D19B;
    background:#FFF7E8;
    color:#6B4300;
    border-radius:var(--radius);
    font-size:13px;
  }
  .warning-bar svg{
    width:15px;
    height:15px;
    flex:0 0 auto;
    margin-top:1px;
  }

  /* group header score summary */
  .gtotal{
    font-size:12px;
    color:var(--accent-dark);
    font-weight:600;
    margin-left:2px;
    padding:2px 8px;
    background:var(--accent-light);
    border-radius:4px;
  }

  /* ---------- Rankings modal ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(55,53,47,0.35);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:24px;
  }
  .modal-panel{
    background:var(--bg);
    border-radius:12px;
    box-shadow:var(--shadow-pop);
    width:100%;
    max-width:640px;
    max-height:min(680px, 88vh);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px 12px;
    flex:0 0 auto;
  }
  .modal-header h2{
    margin:0;
    font-family:'Inter Tight',sans-serif;
    font-size:18px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .modal-close{
    border:none;
    background:transparent;
    color:var(--text-secondary);
    cursor:pointer;
    padding:6px;
    border-radius:6px;
    display:flex;
  }
  .modal-close:hover{ background:var(--bg-hover); color:var(--text); }
  .modal-close svg{ width:16px; height:16px; }
  .modal-tabs{
    display:flex;
    gap:4px;
    padding:0 20px;
    border-bottom:1px solid var(--border);
    flex:0 0 auto;
  }
  .modal-tab{
    border:none;
    background:transparent;
    padding:9px 4px;
    margin-bottom:-1px;
    font-size:13px;
    font-weight:600;
    color:var(--text-secondary);
    cursor:pointer;
    border-bottom:2px solid transparent;
  }
  .modal-tab + .modal-tab{ margin-left:14px; }
  .modal-tab:hover{ color:var(--text); }
  .modal-tab.active{ color:var(--accent-dark); border-bottom-color:var(--accent); }
  .modal-panel.modal-wide{ max-width:980px; }
  .trend-controls{
    padding:0 20px 8px;
    display:flex;
    flex-direction:column;
    gap:10px;
    flex:0 0 auto;
    border-bottom:1px solid var(--border);
  }
  .trend-row{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .trend-row input[type=date]{
    font-family:inherit;
    font-size:13px;
    padding:5px 8px;
    border-radius:6px;
    border:1px solid var(--border-strong);
    background:var(--bg);
    color:var(--text);
  }
  .trend-input{
    font-family:inherit;
    font-size:13px;
    padding:7px 10px;
    border-radius:6px;
    border:1px solid var(--border-strong);
    background:var(--bg);
    color:var(--text);
    flex:1 1 220px;
    max-width:340px;
    min-width:160px;
  }
  .trend-input:focus{ outline:none; border-color:var(--accent); }
  .trend-msg{ font-size:12px; color:var(--danger); }
  .trend-to{ font-size:12px; color:var(--text-faint); }
  .trend-spacer{ flex:1 1 auto; }
  .trend-chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .trend-chip{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:4px 6px 4px 9px;
    border:1px solid var(--border-strong);
    border-radius:999px;
    font-size:12.5px;
    background:var(--bg);
    max-width:100%;
  }
  .trend-swatch{
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--chip);
    flex:0 0 auto;
  }
  .trend-chip .club-emblem{ width:16px; height:16px; border-radius:3px; }
  .trend-chip .val{ font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .trend-chip-type{
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--text-faint);
    font-weight:600;
  }
  .trend-chip-x{
    border:none;
    background:transparent;
    color:var(--text-faint);
    cursor:pointer;
    font-size:16px;
    line-height:1;
    padding:0 5px;
    border-radius:50%;
  }
  .trend-chip-x:hover{ color:var(--danger); }
  .seg{
    display:inline-flex;
    border:1px solid var(--border-strong);
    border-radius:6px;
    overflow:hidden;
  }
  .seg button{
    border:none;
    background:var(--bg);
    padding:5px 10px;
    font-size:12px;
    font-weight:600;
    font-family:inherit;
    color:var(--text-secondary);
    cursor:pointer;
    border-right:1px solid var(--border);
  }
  .seg button:last-child{ border-right:none; }
  .seg button:hover{ background:var(--bg-hover); color:var(--text); }
  .seg button.active{ background:var(--accent-light); color:var(--accent-dark); }
  .trend-check{
    font-size:12px;
    color:var(--text-secondary);
    display:inline-flex;
    align-items:center;
    gap:5px;
    cursor:pointer;
  }
  #trend-chart{ position:relative; }
  #trend-chart svg{ display:block; width:100%; height:auto; touch-action:pan-y; }
  .trend-axis-text{ font-size:11px; fill:var(--text-secondary); font-family:inherit; }
  .trend-tip{
    position:absolute;
    pointer-events:none;
    background:var(--bg);
    border:1px solid var(--border-strong);
    border-radius:8px;
    box-shadow:var(--shadow-pop);
    padding:8px 10px;
    font-size:12px;
    z-index:5;
    min-width:160px;
    display:none;
  }
  .trend-tip .tt-time{ color:var(--text-secondary); margin-bottom:5px; font-size:11.5px; }
  .trend-tip .tt-row{ display:flex; align-items:center; gap:7px; padding:1px 0; }
  .trend-tip .tt-name{ flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:190px; }
  .trend-tip .tt-num{ font-variant-numeric:tabular-nums; font-weight:600; }
  .trend-note{ margin-top:8px; font-size:12px; color:var(--text-faint); }
  .modal-asof{
    display:flex;
    align-items:center;
    gap:8px;
    padding:12px 20px 0;
    flex:0 0 auto;
  }
  .modal-asof input[type=date]{
    font-family:inherit;
    font-size:13px;
    padding:5px 8px;
    border-radius:6px;
    border:1px solid var(--border-strong);
    background:var(--bg);
    color:var(--text);
  }
  .btn-small{
    padding:5px 10px;
    font-size:12px;
  }
  .rankings-asof-note{
    font-size:12px;
    color:var(--text-faint);
    font-style:italic;
  }
  .modal-body{
    overflow-y:auto;
    padding:8px 20px 20px;
    flex:1 1 auto;
  }
  table.rank-table{
    width:100%;
    border-collapse:collapse;
  }
  table.rank-table thead th{
    position:sticky;
    top:0;
    background:var(--bg);
    text-align:left;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    font-weight:600;
    color:var(--text-secondary);
    padding:8px 8px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
  }
  table.rank-table thead th:hover{ color:var(--text); }
  table.rank-table thead th.active-sort{ color:var(--accent-dark); }

    text-overflow:ellipsis;
    white-space:nowrap;

    text-align:right;
    white-space:nowrap;

  /* ---------- Storage warning banner ---------- */

    position:sticky;
    top:0;

    align-items:flex-start;

  /* ================= Tables app additions ================= */
  .table-card{ overflow-x:auto; }

  .cell-check{
    width:17px; height:17px; border:1.5px solid var(--border-strong); border-radius:4px;

  .tags{ display:flex; gap:4px; flex-wrap:nowrap; overflow:hidden; min-width:0; }
  .tag{ flex:0 0 auto; }
  .tag-img{ width:14px; height:14px; border-radius:3px; object-fit:cover; margin-right:5px; flex:0 0 auto; }
  .cell-img-wrap{ position:relative; display:inline-flex; }

  .popover{
    position:fixed; z-index:400; background:var(--bg); border:1px solid var(--border); border-radius:10px;

  .opt-x:hover{ color:var(--danger); background:var(--danger-light); }
  #opt-add{ margin-top:10px; }

  th.col-th{ position:relative; }
  .col-resize{
    position:absolute; top:0; right:-4px; width:9px; height:100%; cursor:col-resize; z-index:3; touch-action:none;
  }
  .col-resize::after{
    content:''; position:absolute; left:4px; top:20%; bottom:20%; width:2px; border-radius:1px;
    background:var(--accent); opacity:0; transition:opacity 0.12s;
  }
  th.col-th:hover .col-resize::after{ opacity:0.35; }
  .col-resize:hover::after, .col-resize.active::after{ opacity:1; }
  body.resizing, body.resizing *{ cursor:col-resize !important; user-select:none !important; }
  th.spacer, td.spacer{ padding:0; }
</style>

<script>
(function(){

  var TAG_PALETTE = [
    {bg:'#E6F1FB', fg:'#0C447C'}, {bg:'#EAF3DE', fg:'#27500A'},
    {bg:'#FAEEDA', fg:'#633806'}, {bg:'#FCEBEB', fg:'#791F1F'},
    {bg:'#FBEAF0', fg:'#72243E'}, {bg:'#EEEDFE', fg:'#3C3489'},
    {bg:'#E1F5EE', fg:'#085041'}, {bg:'#FAECE7', fg:'#712B13'}
  ];
  var POSITIONS = ['GK', 'DF', 'SW', 'CB', 'LB', 'RB', 'LWB', 'RWB', 'DM', 'MF', 'CM', 'AM', 'LM', 'RM', 'LW', 'RW', 'CF', 'ST', 'FW'];
  var MIN_COL_W = 60, MAX_COL_W = 800;

  var DB_NAME = 'tables-app-db';
  var DB_STORE = 'kv';
  var META_KEY = 'tables-app.meta.v1';
  var storageMode = null;
  var storageErrorDetail = '';
  var memoryStore = {};
  var idbPromise = null;

  var idCounter = 1;
  var tables = [];            // [{id, name, createdAt}]
  var currentTableId = null;
  var table = null;           // {v, columns, rows, primaryId, metricId, history}
  var view = {sortColId:'', sortDir:'desc', groupColId:'', filterValue:'all', query:'', collapsed:{}};
  var rankingsState = {open:false, tab:'row', sortField:'m', sortDir:'desc', dateStr:''};
  var trendState = {open:false, kind:'row', series:[], metric:'total', zero:false, preset:'all', fromStr:'', toStr:''};
  var tableMenuOpen = false;
  var dataVersion = 0;        // bumped on every data change; used to cache sorted/filtered views
  var tableToken = 0;         // bumped whenever a different table is loaded

  /* ================= utils ================= */
  function $(id){ return document.getElementById(id); }
  function uid(){ return 'x' + (idCounter++) + Math.random().toString(36).slice(2, 7); }
  var ESC_RE = /[&<>"']/;
  var ESC_RE_G = /[&<>"']/g;
  var ESC_MAP = {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'};
  function esc(str){
    if (str == null) return '';
    str = String(str);
    return ESC_RE.test(str) ? str.replace(ESC_RE_G, function(c){ return ESC_MAP[c]; }) : str;
  }
  function fmtDate(iso){
    if (!iso) return '';
    var parts = String(iso).split('-');
    if (parts.length !== 3) return iso;
    var d = new Date(Date.UTC(+parts[0], +parts[1]-1, +parts[2]));
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString('en-US', {year:'numeric', month:'short', day:'numeric', timeZone:'UTC'});
  }
  function dateToStr(d){
    var m = String(d.getMonth() + 1);
    var day = String(d.getDate());
    if (m.length < 2) m = '0' + m;
    if (day.length < 2) day = '0' + day;
    return d.getFullYear() + '-' + m + '-' + day;
  }
  function todayStr(){ return dateToStr(new Date()); }
  function fmtNumber(v){
    if (v == null || v === '') return '';
    if (Math.abs(v) >= 1000) return Number(v).toLocaleString('en-US', {maximumFractionDigits: 2});
    return String(Math.round(v * 1000) / 1000);
  }

  /* ================= storage (IndexedDB first, with fallbacks) ================= */
  function describeErr(err){
    return (err && err.name ? err.name + ': ' : '') + (err && err.message ? err.message : String(err));
  }

  function idbOpen(){
    if (idbPromise) return idbPromise;
    idbPromise = new Promise(function(resolve, reject){
      if (!window.indexedDB){ reject(new Error('IndexedDB is not available in this browser.')); return; }
      var req;
      try {
        req = indexedDB.open(DB_NAME, 1);
      } catch (err){ reject(err); return; }
      req.onupgradeneeded = function(e){
        var db = e.target.result;
        if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
      };
      req.onsuccess = function(e){ resolve(e.target.result); };
      req.onerror = function(e){ reject((e.target && e.target.error) || new Error('Could not open IndexedDB.')); };
      req.onblocked = function(){ reject(new Error('IndexedDB open was blocked.')); };
    });
    return idbPromise;
  }

  function idbGet(key){
    return idbOpen().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(DB_STORE, 'readonly');
        var store = tx.objectStore(DB_STORE);
        var req = store.get(key);
        req.onsuccess = function(){ resolve(req.result); };
        req.onerror = function(){ reject(req.error || new Error('IndexedDB read failed.')); };
      });
    });
  }

  function idbSet(key, value){
    return idbOpen().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(DB_STORE, 'readwrite');
        var store = tx.objectStore(DB_STORE);
        var req = store.put(value, key);
        req.onsuccess = function(){ resolve(); };
        req.onerror = function(){ reject(req.error || new Error('IndexedDB write failed.')); };
      });
    });
  }

  function probeStorage(store){
    var testKey = '__rm_probe__';
    store.setItem(testKey, '1');
    store.removeItem(testKey);
  }

  function readSyncFallbackKey(key){
    if (Object.prototype.hasOwnProperty.call(memoryStore, key)) return memoryStore[key];
    try {
      probeStorage(window.localStorage);
      storageMode = 'local';
      return localStorage.getItem(key);
    } catch (e){ /* keep trying */ }
    try {
      probeStorage(window.sessionStorage);
      storageMode = 'session';
      return sessionStorage.getItem(key);
    } catch (e2){ /* keep trying */ }
    storageMode = 'memory';
    return memoryStore[key] || null;
  }

  function readKeyChain(key){
    return idbGet(key).then(function(value){
      storageMode = 'indexeddb';
      return value || null;
    }).catch(function(err){
      console.warn('IndexedDB unavailable, falling back to browser storage:', err);
      storageErrorDetail = describeErr(err);
      return readSyncFallbackKey(key);
    }).then(function(value){
      setStorageWarning(storageMode);
      return value;
    });
  }

  function writeKeyChain(key, payload){
    return idbSet(key, payload).then(function(){
      storageMode = 'indexeddb';
      setStorageWarning('indexeddb');
      return true;
    }).catch(function(err){
      console.warn('IndexedDB save failed, falling back:', err);
      storageErrorDetail = describeErr(err);
      try {
        localStorage.setItem(key, payload);
        storageMode = 'local';
        setStorageWarning('local');
        return true;
      } catch (err2){
        console.warn('localStorage save failed, falling back to sessionStorage:', err2);
        storageErrorDetail = describeErr(err2);
        try {
          sessionStorage.setItem(key, payload);
          storageMode = 'session';
          setStorageWarning('session');
          return true;
        } catch (err3){
          console.warn('sessionStorage save failed, falling back to memory:', err3);
          storageErrorDetail = describeErr(err3);
          memoryStore[key] = payload;
          storageMode = 'memory';
          setStorageWarning('memory');
          return false;
        }
      }
    });
  }

  function deleteKeyChain(key){
    var idbDone = idbOpen().then(function(db){
      return new Promise(function(resolve){
        try {
          var tx = db.transaction(DB_STORE, 'readwrite');
          var req = tx.objectStore(DB_STORE).delete(key);
          req.onsuccess = function(){ resolve(); };
          req.onerror = function(){ resolve(); };
        } catch (e){ resolve(); }
      });
    }).catch(function(){});
    try { localStorage.removeItem(key); } catch (e){}
    try { sessionStorage.removeItem(key); } catch (e){}
    delete memoryStore[key];
    return idbDone;
  }

  function setStorageWarning(mode){
    var el = document.getElementById('storage-warning');
    if (!el) return;
    if (mode === 'indexeddb'){
      el.style.display = 'none';
      return;
    }
    el.style.display = 'flex';
    el.classList.toggle('storage-warning-mild', mode === 'local' || mode === 'session');
    var textEl = document.getElementById('storage-warning-text');
    var detailEl = document.getElementById('storage-warning-detail');
    if (mode === 'local'){
      textEl.innerHTML = '<strong>Using a smaller, fallback storage mode.</strong> IndexedDB (this app\'s primary storage) isn\'t available, so a lower-capacity storage is being used instead. Your data still persists between visits, but a very large table with many images could hit its limit again. Export occasionally as a backup.';
    } else if (mode === 'session'){
      textEl.innerHTML = '<strong>Persistent storage is blocked in this browser.</strong> Your tables is being kept for this browser tab only — it will survive a page refresh, but will be lost if you close the tab. Use <strong>Export</strong> to save a permanent copy.';
    } else {
      textEl.innerHTML = '<strong>This browser is blocking all storage for this page.</strong> Changes exist only until you close or refresh. Use <strong>Export</strong> regularly to save your work as a file.';

  /* ================= batched storage ================= */
  function idbBatch(puts, dels){
    return idbOpen().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(DB_STORE, 'readwrite');
        var st = tx.objectStore(DB_STORE);
        puts.forEach(function(p){ st.put(p[1], p[0]); });
        dels.forEach(function(k){ st.delete(k); });
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error || new Error('IndexedDB write failed.')); };
        tx.onabort = function(){ reject(tx.error || new Error('IndexedDB write was aborted.')); };
      });
    });
  }

  /* many writes/deletes in one go: one IndexedDB transaction, or key by key on the fallbacks */
  function writeBatchChain(puts, dels){
    if (!puts.length && !dels.length) return Promise.resolve(true);
    return idbBatch(puts, dels).then(function(){
      storageMode = 'indexeddb';
      setStorageWarning('indexeddb');
      return true;
    }).catch(function(err){
      console.warn('IndexedDB save failed, falling back:', err);
      storageErrorDetail = describeErr(err);
      function tryStore(getStore, mode){
        try {
          var store = getStore();
          puts.forEach(function(p){ store.setItem(p[0], p[1]); });
          dels.forEach(function(k){ store.removeItem(k); });
          storageMode = mode;
          setStorageWarning(mode);
          return true;
        } catch (e){
          storageErrorDetail = describeErr(e);
          return false;
        }
      }
      if (tryStore(function(){ return window.localStorage; }, 'local')) return true;
      if (tryStore(function(){ return window.sessionStorage; }, 'session')) return true;
      puts.forEach(function(p){ memoryStore[p[0]] = p[1]; });
      dels.forEach(function(k){ delete memoryStore[k]; });
      storageMode = 'memory';
      setStorageWarning('memory');
      return false;
    });
  }

  /* read many keys at once -> {key: value} (missing keys are simply absent) */
  function readManyChain(keys){
    if (!keys.length) return Promise.resolve({});
    return idbOpen().then(function(db){
      return new Promise(function(resolve, reject){
        var out = {};
        var tx = db.transaction(DB_STORE, 'readonly');
        var st = tx.objectStore(DB_STORE);
        keys.forEach(function(k){
          var rq = st.get(k);
          rq.onsuccess = function(){ if (rq.result !== undefined) out[k] = rq.result; };
        });
        tx.oncomplete = function(){ resolve(out); };
        tx.onerror = function(){ reject(tx.error || new Error('IndexedDB read failed.')); };
        tx.onabort = function(){ reject(tx.error || new Error('IndexedDB read was aborted.')); };
      });
    }).then(function(out){
      storageMode = 'indexeddb';
      return out;
    }).catch(function(err){
      console.warn('IndexedDB unavailable, falling back to browser storage:', err);
      storageErrorDetail = describeErr(err);
      var out = {};
      keys.forEach(function(k){ var v = readSyncFallbackKey(k); if (v != null) out[k] = v; });
      return out;
    });
  }

  /* ================= images =================
     Pictures are stored once, under a short id derived from their content, and shown through a
     single blob: URL. Tables and dropdown options only keep the id. */
  var IMG_MAX = 96;                // longest side, in pixels, of stored pictures
  var imageData = {};              // id -> data URL (kept so it can be saved / exported)
  var imageUrls = {};              // id -> blob: URL used by <img> tags

  function isImageId(v){ return typeof v === 'string' && v.indexOf('img_') === 0; }
  function isDataImage(v){ return typeof v === 'string' && v.indexOf('data:image') === 0; }

  function hashString(str){
    var h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (var i = 0; i < str.length; i++){
      var ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return 4294967296 * (2097151 & h2) + (h1 >>> 0);
  }

  function internImage(dataUrl){
    var id = 'img_' + hashString(dataUrl).toString(36) + dataUrl.length.toString(36);
    if (!imageData[id]) imageData[id] = dataUrl;
    return id;
  }

  function dataUrlToBlob(du){
    var comma = du.indexOf(',');
    var mime = du.slice(5, comma).split(';')[0] || 'image/png';
    var bin = atob(du.slice(comma + 1));
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], {type: mime});
  }

  /* what to put in an <img src>: the same short blob URL every time for the same picture */
  function imgSrc(v){
    if (!v) return '';
    if (isDataImage(v)) return v;
    if (imageUrls[v]) return imageUrls[v];
    var data = imageData[v];
    if (!data) return '';
    var url = data;
    try { url = URL.createObjectURL(dataUrlToBlob(data)); } catch (e){ url = data; }
    imageUrls[v] = url;
    return url;
  }

  function encodeImage(img, maxDim){
    var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    var scale = Math.min(1, maxDim / Math.max(w, h));
    var tw = Math.max(1, Math.round(w * scale)), th = Math.max(1, Math.round(h * scale));
    var canvas = document.createElement('canvas');
    canvas.width = tw; canvas.height = th;
    var ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, tw, th);
    ctx.drawImage(img, 0, 0, tw, th);
    var out = canvas.toDataURL('image/webp', 0.85);              // keeps transparency, much smaller than PNG
    if (out.indexOf('data:image/webp') !== 0) out = canvas.toDataURL('image/png');   // browsers that can't encode WebP
    return out;
  }

  /* re-encode an existing picture at the compact size; keeps the original if that isn't smaller */
  function shrinkDataUrl(dataUrl, maxDim){
    return new Promise(function(resolve){
      var done = false;
      function fin(v){ if (!done){ done = true; clearTimeout(timer); resolve(v); } }
      var timer = setTimeout(function(){ fin(dataUrl); }, 4000);
      try {
        var img = new Image();
        img.onload = function(){
          try {
            var out = encodeImage(img, maxDim);
            fin(out && out.length < dataUrl.length ? out : dataUrl);
          } catch (e){ fin(dataUrl); }
        };
        img.onerror = function(){ fin(dataUrl); };
        img.src = dataUrl;
      } catch (e){ fin(dataUrl); }
    });
  }

  /* swap any inline data-URL pictures in a table for compact, shared image ids */
  function internInlineImages(t){
    var urls = {};
    t.columns.forEach(function(c){
      if (c.options) c.options.forEach(function(o){ if (isDataImage(o.img)) urls[o.img] = true; });
    });
    var imgCols = t.columns.filter(function(c){ return c.type === 'image'; });
    t.rows.forEach(function(r){
      imgCols.forEach(function(c){ if (isDataImage(r.c[c.id])) urls[r.c[c.id]] = true; });
    });
    var list = Object.keys(urls);
    if (!list.length) return Promise.resolve(t);
    return Promise.all(list.map(function(u){
      return shrinkDataUrl(u, IMG_MAX).then(function(nu){ return [u, internImage(nu)]; });
    })).then(function(pairs){
      var map = {};
      pairs.forEach(function(p){ map[p[0]] = p[1]; });
      t.columns.forEach(function(c){
        if (c.options) c.options.forEach(function(o){ if (map[o.img]) o.img = map[o.img]; });
      });
      t.rows.forEach(function(r){
        imgCols.forEach(function(c){ if (map[r.c[c.id]]) r.c[c.id] = map[r.c[c.id]]; });
      });
      return t;
    });
  }

  /* ================= model helpers ================= */
  function colById(id){ return table.columns.find(function(c){ return c.id === id; }) || null; }
  function primaryCol(){ return colById(table.primaryId) || table.columns[0] || null; }
  function metricCol(){ var c = colById(table.metricId); return (c && c.type === 'number') ? c : null; }
  function optById(col, id){ return (col.options || []).find(function(o){ return o.id === id; }) || null; }
  function optByLabel(col, label){ return (col.options || []).find(function(o){ return o.label === label; }) || null; }
  function groupableCols(){ return table.columns.filter(function(c){ return c.type === 'select' || c.type === 'country'; }); }
  function isOptionType(t){ return t === 'select' || t === 'multiselect'; }

  function emptyValue(type){
    if (type === 'checkbox') return false;
    if (type === 'multiselect') return [];

  function tagStyle(o){
    var p = TAG_PALETTE[(o.color || 0) % TAG_PALETTE.length];
    return 'background:' + p.bg + ';color:' + p.fg + ';';

  function tagHtml(o){
    return '<span class="tag" style="' + tagStyle(o) + '">' +
      (o.img && imgSrc(o.img) ? '<img class="tag-img" src="' + esc(imgSrc(o.img)) + '" alt="">' : '') + esc(o.label) + '</span>';
  }

  function cellText(row, col){
    var v = row.c[col.id];
    switch (col.type){
      case 'text': case 'date': case 'country': return v == null ? '' : String(v);
      case 'number': return (typeof v === 'number' && isFinite(v)) ? String(v) : '';
      case 'checkbox': return v === true ? 'Yes' : 'No';
      case 'select': var o = optById(col, v); return o ? o.label : '';
      case 'multiselect':
        return (Array.isArray(v) ? v : []).map(function(id){ var x = optById(col, id); return x ? x.label : ''; }).filter(Boolean).join(', ');
      default: return '';
    }
  }
  function rowLabel(row){
    var c = primaryCol();
    var t = c ? cellText(row, c).trim() : '';
    return t || 'Untitled';
  }
  function groupKeyOf(row, col){
    var v = row.c[col.id];
    if (col.type === 'select'){ var o = optById(col, v); return o ? o.label : ''; }
    return v || '';
  }
  function groupIcon(col, key){
    if (!key) return '';
    if (col.type === 'country') return countryFlag(key);
    var o = optByLabel(col, key);
    return (o && o.img && imgSrc(o.img)) ? '<img class="club-emblem" src="' + esc(imgSrc(o.img)) + '" alt="">' : '';
  }
  function metricOf(row){
    var v = table.metricId ? row.c[table.metricId] : null;
    return (typeof v === 'number' && isFinite(v)) ? v : null;
  }
  function metricName(){ var c = metricCol(); return c ? c.name : 'Metric'; }

  function normalizeValue(col, v){
    switch (col.type){
      case 'text': return v == null ? '' : String(v);
      case 'number': var n = typeof v === 'number' ? v : parseFloat(v); return isFinite(n) ? n : '';
      case 'date': return (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) ? v : '';
      case 'checkbox': return v === true || v === 'true';
      case 'select': return optById(col, v) ? v : '';
      case 'multiselect': return Array.isArray(v) ? v.filter(function(id){ return optById(col, id); }) : [];
      case 'image': return (isImageId(v) || isDataImage(v)) ? v : '';
      case 'country': return typeof v === 'string' ? normalizeAssociationName(v) : '';
    }
    return '';
  }

  function mkCol(name, type){
    var c = {id: uid(), name: name, type: type};
    if (isOptionType(type)) c.options = [];
    return c;
  }
  function mkOption(col, label){
    var o = {id: uid(), label: label, color: (col.options.length) % TAG_PALETTE.length, img: ''};
    col.options.push(o);
    return o;
  }
  function ensureOption(col, label){
    label = String(label || '').trim();
    if (!label) return null;
    return optByLabel(col, label) || mkOption(col, label);
  }

  function normalizeTable(t){
    t = (t && typeof t === 'object') ? t : {};
    var cols = Array.isArray(t.columns) ? t.columns : [];
    t.columns = cols.filter(function(c){ return c && c.id && TYPES[c.type]; }).map(function(c){
      c.name = String(c.name || 'Untitled');
      if (typeof c.width === 'number' && isFinite(c.width)) c.width = Math.max(MIN_COL_W, Math.min(MAX_COL_W, Math.round(c.width)));
      else delete c.width;
      if (isOptionType(c.type)){
        c.options = (Array.isArray(c.options) ? c.options : []).map(function(o, i){
          return {id: o.id || uid(), label: String(o.label == null ? '' : o.label), color: (+o.color || 0) % TAG_PALETTE.length, img: o.img || ''};
        });
      } else { delete c.options; }
      return c;
    });
    if (!t.columns.length) t.columns = [mkCol('Name', 'text')];
    t.rows = (Array.isArray(t.rows) ? t.rows : []).map(function(r){
      var cells = {};
      t.columns.forEach(function(c){
        var raw = r && r.c ? r.c[c.id] : undefined;
        cells[c.id] = raw === undefined ? emptyValue(c.type) : normalizeValue(c, raw);
      });
      return {id: (r && r.id) || uid(), c: cells};
    });
    var prim = t.columns.find(function(c){ return c.id === t.primaryId && c.type === 'text'; })
      || t.columns.find(function(c){ return c.type === 'text'; }) || t.columns[0];
    t.primaryId = prim.id;
    var met = t.columns.find(function(c){ return c.id === t.metricId && c.type === 'number'; });
    t.metricId = met ? met.id : null;
    t.history = (t.history && typeof t.history === 'object') ? t.history : {};
    Object.keys(t.history).forEach(function(id){ if (!Array.isArray(t.history[id])) delete t.history[id]; });
    t.images = Array.isArray(t.images) ? t.images.filter(isImageId) : [];
    t.v = 2;
    return t;
  }

  /* ---- history (snapshots of the metric + category columns, used by rankings "as of" and trends) ---- */
  function snapshotOf(row){
    var g = {};
    groupableCols().forEach(function(c){ g[c.id] = groupKeyOf(row, c); });
    return {label: rowLabel(row), m: metricOf(row), g: g};
  }
  function recordHistory(row){
    if (!table.metricId) return;
    var s = snapshotOf(row);
    var arr = table.history[row.id];
    if (!arr){ arr = table.history[row.id] = []; markMeta(); }
    var last = arr[arr.length - 1];
    if (last && !last.del && last.label === s.label && last.m === s.m && JSON.stringify(last.g) === JSON.stringify(s.g)) return;
    arr.push({t: Date.now(), label: s.label, m: s.m, g: s.g});
    markHist(row.id);
    if (arr.length > 40 && arr.length % 20 === 0){
      var packed = compactHistArr(arr, Date.now());
      if (packed) table.history[row.id] = packed;
    }
  }
  function recordAllHistory(){ table.rows.forEach(recordHistory); }
  function resetHistory(){
    Object.keys(table.history).forEach(markHist);
    table.history = {};
    markMeta();
  }
  function markDeleted(row){
    if (!table.metricId) return;
    var arr = table.history[row.id];
    if (!arr || !arr.length) return;
    var s = snapshotOf(row);
    arr.push({t: Date.now(), label: s.label, m: s.m, g: s.g, del: true});
    markHist(row.id);
  }

  /* Keep every snapshot for the last two weeks; beyond that keep only the last snapshot of each
     day. "As of" rankings read end-of-day state, so this loses nothing they can show. */
  var HIST_FULL_MS = 14 * 86400000;
  function compactHistArr(arr, now){
    if (arr.length < 3) return null;
    var cutoff = now - HIST_FULL_MS;
    var out = [];
    for (var i = 0; i < arr.length; i++){
      var s = arr[i], next = arr[i + 1];
      if (s.t >= cutoff || !next || next.t >= cutoff || dateToStr(new Date(next.t)) !== dateToStr(new Date(s.t))) out.push(s);
    }
    return out.length < arr.length ? out : null;
  }
  function compactAllHistory(){
    var now = Date.now();
    Object.keys(table.history).forEach(function(id){
      var packed = compactHistArr(table.history[id], now);
      if (packed){ table.history[id] = packed; markHist(id); }
    });
  }
  function latestSnapAt(arr, T){
    var lo = 0, hi = arr.length - 1, found = -1;
    while (lo <= hi){
      var mid = (lo + hi) >> 1;
      if (arr[mid].t <= T){ found = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    return found >= 0 ? arr[found] : null;
  }
  function rowsAsOf(ms){
    var out = [];
    Object.keys(table.history).forEach(function(id){
      var sn = latestSnapAt(table.history[id], ms);
      if (sn && !sn.del) out.push({id: id, label: sn.label, m: sn.m, g: sn.g || {}});
    });
    return out;
  }
  function earliestHistoryMs(){
    var min = Infinity;
    Object.keys(table.history).forEach(function(id){
      var arr = table.history[id];
      if (arr && arr.length && arr[0].t < min) min = arr[0].t;
    });
    return isFinite(min) ? min : Date.now();
  }

  /* ---- converting a column to another type (best effort) ---- */
  function convertColumn(col, newType){
    var oldType = col.type;
    var oldOptions = col.options ? col.options.slice() : [];
    var opts = oldOptions.slice();
    function ensureOpt(label){
      label = String(label || '').trim();
      if (!label) return null;
      var o = opts.find(function(x){ return x.label === label; });
      if (!o){ o = {id: uid(), label: label, color: opts.length % TAG_PALETTE.length, img: ''}; opts.push(o); }
      return o;
    }
    var tmpCol = {id: 'x', type: oldType, options: oldOptions};
    table.rows.forEach(function(r){
      var v = r.c[col.id];
      var text = cellText({c: {x: v}}, tmpCol);
      if (oldType === 'checkbox') text = v === true ? 'Yes' : '';
      var nv;
      switch (newType){
        case 'text': nv = text; break;
        case 'number': var n = parseFloat(String(text).replace(/,/g, '')); nv = isFinite(n) ? n : ''; break;
        case 'date': nv = /^\d{4}-\d{2}-\d{2}$/.test(text) ? text : ''; break;
        case 'checkbox': nv = oldType === 'checkbox' ? v : /^(true|yes|y|1|x)$/i.test(String(text).trim()); break;
        case 'select':
          var first = String(text).split(/[,;]/)[0];
          var fo = ensureOpt(first); nv = fo ? fo.id : ''; break;
        case 'multiselect':
          nv = String(text).split(/[,;]/).map(function(s){ var o = ensureOpt(s); return o ? o.id : null; }).filter(Boolean); break;
        case 'country':
          var nm = normalizeAssociationName(String(text).trim());
          var hit = countryOptions.find(function(c){ return c.name.toLowerCase() === nm.toLowerCase(); });
          nv = hit ? hit.name : ''; break;
        case 'image': nv = (isImageId(v) || isDataImage(v)) ? v : ''; break;
        default: nv = '';
      }
      r.c[col.id] = nv;
    });
    col.type = newType;
    if (isOptionType(newType)) col.options = opts; else delete col.options;
  }

  /* ---- templates ---- */
  function makeTemplate(kind){
    var t = {v: 1, columns: [], rows: [], primaryId: null, metricId: null, history: {}};
    var add = function(name, type){ var c = mkCol(name, type); t.columns.push(c); return c; };
    if (kind === 'footballer'){
      var name = add('Name', 'text'); add('Nationality', 'country'); add('Club', 'select');
      var pos = add('Position', 'select');
      POSITIONS.forEach(function(p){ mkOption(pos, p); });
      add('Birthday', 'date'); add('Height (cm)', 'number');
      var score = add('Score', 'number'); t.metricId = score.id; t.primaryId = name.id;
    } else if (kind === 'books'){
      var title = add('Title', 'text'); add('Author', 'text');
      var status = add('Status', 'select');
      ['To read', 'Reading', 'Finished'].forEach(function(s){ mkOption(status, s); });
      add('Genre', 'multiselect'); var rating = add('Rating', 'number'); add('Finished on', 'date');
      add('Owned', 'checkbox'); add('Cover', 'image');
      t.metricId = rating.id; t.primaryId = title.id;
    } else {
      var n = add('Name', 'text'); t.primaryId = n.id;
    }
    return t;
  }

  function addSampleFootballers(t){
    var cols = {}; t.columns.forEach(function(c){ cols[c.name] = c; });
    [
      ['Kenji Sato', 'Japan', 'FC Meridian', 'MF', '1999-04-12', 178, 88],
      ['Lucas Ferreira', 'Brazil', 'Riverside United', 'FW', '2001-08-23', 181, 92],
      ['Tomas Novak', 'Czechia', 'FC Meridian', 'GK', '1997-01-05', 191, 79],
      ['Ahmed Diallo', 'Senegal', 'Northgate SC', 'DF', '2000-11-30', 186, 83]
    ].forEach(function(s){
      var r = {id: uid(), c: {}};
      t.columns.forEach(function(c){ r.c[c.id] = emptyValue(c.type); });
      r.c[cols['Name'].id] = s[0];
      r.c[cols['Nationality'].id] = s[1];
      var club = ensureOption(cols['Club'], s[2]); r.c[cols['Club'].id] = club.id;
      var pos = ensureOption(cols['Position'], s[3]); r.c[cols['Position'].id] = pos.id;
      r.c[cols['Birthday'].id] = s[4]; r.c[cols['Height (cm)'].id] = s[5]; r.c[cols['Score'].id] = s[6];
      t.rows.push(r);
    });
  }

  /* ---- importing exports from the original footballer app ---- */
  function legacyToTable(parsed){
    var list = Array.isArray(parsed) ? parsed : parsed.players;
    var logos = (parsed && !Array.isArray(parsed) && parsed.clubLogos) || {};
    var hist = (parsed && !Array.isArray(parsed) && parsed.scoreHistory) || {};
    var t = makeTemplate('footballer');
    var by = {}; t.columns.forEach(function(c){ by[c.name] = c; });
    (list || []).forEach(function(p){
      var r = {id: p.id || uid(), c: {}};
      t.columns.forEach(function(c){ r.c[c.id] = emptyValue(c.type); });
      r.c[by['Name'].id] = p.name || '';
      r.c[by['Nationality'].id] = normalizeAssociationName(p.nationality || '');
      var clubLabel = String(p.club || '').trim();
      if (clubLabel){
        var co = ensureOption(by['Club'], clubLabel);
        if (logos[clubLabel] && !co.img) co.img = logos[clubLabel];
        r.c[by['Club'].id] = co.id;
      }
      if (p.position){ var po = ensureOption(by['Position'], p.position); if (po) r.c[by['Position'].id] = po.id; }
      r.c[by['Birthday'].id] = p.birthday || '';
      r.c[by['Height (cm)'].id] = (p.height === '' || p.height == null) ? '' : Number(p.height);
      r.c[by['Score'].id] = Number(p.score) || 0;
      t.rows.push(r);
    });
    Object.keys(hist).forEach(function(id){
      if (!Array.isArray(hist[id])) return;
      t.history[id] = hist[id].map(function(sn){
        var g = {};
        g[by['Club'].id] = String(sn.club || '').trim();
        g[by['Nationality'].id] = normalizeAssociationName(sn.nationality || '');
        var e = {t: sn.t, label: sn.name || 'Untitled', m: (typeof sn.score === 'number' ? sn.score : null), g: g};
        if (sn.del) e.del = true;
        return e;
      });
    });
    return normalizeTable(t);
  }

  /* ================= persistence =================
     A table is stored as many small records instead of one big blob:
       meta      columns, settings, the list of row ids, and which images / histories exist
       r.<id>    one record per row
       h.<id>    one history record per row
       i.<id>    one record per image
     Only the records that changed are rewritten on save. */
  function tkey(tid, part){ return 'tables-app.t2.' + tid + '.' + part; }
  function legacyTableKey(id){ return 'tables-app.table.v1.' + id; }

  function freshDirty(){ return {any: false, meta: false, rows: {}, hist: {}}; }
  var dirty = freshDirty();
  var saveTimer = null;
  function markMeta(){ dirty.meta = true; dirty.any = true; }
  function markRow(id){ dirty.rows[id] = true; dirty.any = true; }
  function markHist(id){ dirty.hist[id] = true; dirty.any = true; }
  function markAllRows(){ table.rows.forEach(function(r){ dirty.rows[r.id] = true; }); dirty.any = true; }
  function markAllHist(){ Object.keys(table.history).forEach(markHist); }

  function scheduleSave(){
    dataVersion++;
    markMeta();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flushSave, 350);
  }

  function referencedImages(t){
    var refs = {};
    t.columns.forEach(function(c){
      if (c.options) c.options.forEach(function(o){ if (isImageId(o.img)) refs[o.img] = true; });
    });
    var imgCols = t.columns.filter(function(c){ return c.type === 'image'; });
    if (imgCols.length){
      t.rows.forEach(function(r){
        imgCols.forEach(function(c){ var v = r.c[c.id]; if (isImageId(v)) refs[v] = true; });
      });
    }
    return refs;
  }

  function metaOf(t){
    return {
      v: 2, columns: t.columns, primaryId: t.primaryId, metricId: t.metricId,
      rowIds: t.rows.map(function(r){ return r.id; }),
      histIds: Object.keys(t.history).filter(function(id){ return t.history[id].length; }),
      images: t.images || []
    };
  }

  /* every record of a table (used for brand-new tables, imports and migrations) */
  function fullPuts(tid, t){
    var refs = referencedImages(t);
    t.images = Object.keys(refs).filter(function(id){ return imageData[id]; });
    var puts = [[tkey(tid, 'meta'), JSON.stringify(metaOf(t))]];
    t.rows.forEach(function(r){ puts.push([tkey(tid, 'r.' + r.id), JSON.stringify(r.c)]); });
    Object.keys(t.history).forEach(function(id){
      if (t.history[id].length) puts.push([tkey(tid, 'h.' + id), JSON.stringify(t.history[id])]);
    });
    t.images.forEach(function(id){ puts.push([tkey(tid, 'i.' + id), imageData[id]]); });
    return puts;
  }
  function allKeysOf(tid, t){
    var keys = [tkey(tid, 'meta'), legacyTableKey(tid)];
    t.rows.forEach(function(r){ keys.push(tkey(tid, 'r.' + r.id)); });
    Object.keys(t.history).forEach(function(id){ keys.push(tkey(tid, 'h.' + id)); });
    (t.images || []).forEach(function(id){ keys.push(tkey(tid, 'i.' + id)); });
    return keys;
  }

  function saveTableNow(){
    var t = table, tid = currentTableId;
    if (!t || !tid) return Promise.resolve(true);
    var d = dirty;
    dirty = freshDirty();
    var puts = [], dels = [];
    try {
      // images: write the new ones, drop the ones nothing uses any more
      var refs = referencedImages(t);
      var known = {};
      (t.images || []).forEach(function(id){ known[id] = true; });
      var keep = [];
      Object.keys(refs).forEach(function(id){
        if (!imageData[id]) return;
        keep.push(id);
        if (!known[id]) puts.push([tkey(tid, 'i.' + id), imageData[id]]);
      });
      (t.images || []).forEach(function(id){ if (!refs[id]) dels.push(tkey(tid, 'i.' + id)); });
      if (keep.length !== (t.images || []).length || puts.length || dels.length){ t.images = keep; d.meta = true; }
      var byId = {};
      t.rows.forEach(function(r){ byId[r.id] = r; });
      Object.keys(d.rows).forEach(function(id){
        if (byId[id]) puts.push([tkey(tid, 'r.' + id), JSON.stringify(byId[id].c)]);
        else dels.push(tkey(tid, 'r.' + id));
      });
      Object.keys(d.hist).forEach(function(id){
        var h = t.history[id];
        if (h && h.length) puts.push([tkey(tid, 'h.' + id), JSON.stringify(h)]);
        else dels.push(tkey(tid, 'h.' + id));
      });
      if (d.meta) puts.push([tkey(tid, 'meta'), JSON.stringify(metaOf(t))]);
    } catch (err){
      storageMode = 'memory'; storageErrorDetail = describeErr(err);
      setStorageWarning('memory');
      return Promise.resolve(false);
    }
    return writeBatchChain(puts, dels);
  }
  function flushSave(){
    clearTimeout(saveTimer);
    saveTimer = null;
    if (!dirty.any || !table || !currentTableId) return Promise.resolve(true);
    return saveTableNow();
  }
  function saveMeta(){
    var payload;
    try { payload = JSON.stringify({tables: tables, currentTableId: currentTableId}); }
    catch (err){ return Promise.resolve(false); }
    return writeKeyChain(META_KEY, payload);
  }

  function parseJson(s, fallback){ try { return JSON.parse(s); } catch (e){ return fallback; } }

  function loadTable(id){
    return readKeyChain(tkey(id, 'meta')).then(function(metaStr){
      var meta = metaStr ? parseJson(metaStr, null) : null;
      if (meta && Array.isArray(meta.columns)) return loadFromRecords(id, meta);
      return readKeyChain(legacyTableKey(id)).then(function(old){
        var parsed = old ? parseJson(old, null) : null;
        if (!parsed){
          var blank = normalizeTable(makeTemplate('blank'));
          blank._needsFullWrite = true;
          return blank;
        }
        // a table saved by the first version of this app: one big record with images inline
        var t = normalizeTable(parsed);
        return internInlineImages(t).then(function(){
          t._needsFullWrite = true;
          t._legacyKey = legacyTableKey(id);
          return t;
        });
      });
    });
  }

  function loadFromRecords(id, meta){
    var rowIds = meta.rowIds || [], histIds = meta.histIds || [], imgIds = meta.images || [];
    var keys = rowIds.map(function(r){ return tkey(id, 'r.' + r); })
      .concat(histIds.map(function(h){ return tkey(id, 'h.' + h); }))
      .concat(imgIds.map(function(i){ return tkey(id, 'i.' + i); }));
    return readManyChain(keys).then(function(map){
      var t = {columns: meta.columns, primaryId: meta.primaryId, metricId: meta.metricId, rows: [], history: {}, images: []};
      rowIds.forEach(function(rid){
        var s = map[tkey(id, 'r.' + rid)];
        var c = s == null ? null : parseJson(s, null);
        if (c) t.rows.push({id: rid, c: c});
      });
      histIds.forEach(function(hid){
        var s = map[tkey(id, 'h.' + hid)];
        var h = s == null ? null : parseJson(s, null);
        if (Array.isArray(h)) t.history[hid] = h;
      });
      imgIds.forEach(function(iid){
        var s = map[tkey(id, 'i.' + iid)];
        if (typeof s === 'string'){ imageData[iid] = s; t.images.push(iid); }
      });
      return normalizeTable(t);
    });
  }

  /* called once a loaded table has been assigned to `table` */
  function afterLoad(){
    dirty = freshDirty();
    dataVersion++;
    tableToken++;
    compactAllHistory();
    if (table._needsFullWrite){
      var legacy = table._legacyKey;
      delete table._needsFullWrite;
      delete table._legacyKey;
      markMeta(); markAllRows(); markAllHist();
      flushSave().then(function(){ if (legacy) deleteKeyChain(legacy); });
    } else if (dirty.any){
      scheduleSave();
    }
  }

  function newTableId(){ return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function loadMetaOrCreateDefault(){
    return readKeyChain(META_KEY).then(function(stored){
      if (stored){
        var m = parseJson(stored, null);
        if (m && Array.isArray(m.tables) && m.tables.length){
          tables = m.tables;
          currentTableId = tables.some(function(x){ return x.id === m.currentTableId; }) ? m.currentTableId : tables[0].id;
          return;
        }
      }
      var id = newTableId();
      var t = makeTemplate('footballer');
      addSampleFootballers(t);
      tables = [{id: id, name: 'Footballer roster', createdAt: Date.now()}];
      currentTableId = id;
      table = normalizeTable(t);
      recordAllHistory();
      dirty = freshDirty();
      return writeBatchChain(fullPuts(id, table), []).then(saveMeta);
    });
  }

  /* ================= main table rendering ================= */
  var SVG_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  var SVG_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';

  function effectiveSort(){
    var c = view.sortColId && colById(view.sortColId);
    if (c) return {colId: c.id, dir: view.sortDir};
    if (metricCol()) return {colId: table.metricId, dir: 'desc'};
    return null;
  }

  function sortKey(row, col){
    var v = row.c[col.id];
    switch (col.type){
      case 'number': return (typeof v === 'number') ? {v: v} : {e: true};
      case 'checkbox': return {v: v === true ? 1 : 0};
      case 'image': return v ? {v: 1} : {e: true};
      default:
        var t = cellText(row, col).toLowerCase();
        return t ? {v: t} : {e: true};
    }
  }

  function sortRows(rows){
    var s = effectiveSort();
    if (!s) return rows.slice();
    var col = colById(s.colId);
    var order = {};
    table.rows.forEach(function(r, i){ order[r.id] = i; });

    $('duplicate-warning-text').textContent = 'Duplicate ' + (pc.name || 'name').toLowerCase() + ' values: ' + dups.slice(0, 6).join(', ') + (dups.length > 6 ? ' and ' + (dups.length - 6) + ' more' : '') + '.';
    bar.style.display = 'flex';
  }

  /* ================= editing cells ================= */
  function commitCell(row, col, value){
    row.c[col.id] = value;
    recordHistory(row);
    markRow(row.id);
    scheduleSave();
    afterEdit(row);
  }

  function onTbodyClick(e){
    var del = e.target.closest('.del-btn');
    if (del){ deleteRow(del.getAttribute('data-del')); return; }
    var gh = e.target.closest('.group-header');
    if (gh){
      var k = gh.getAttribute('data-group');
      view.collapsed[k] = !view.collapsed[k];
      render();
      return;
    }
    var td = e.target.closest('td[data-col]');
    if (!td) return;
    var tr = td.closest('tr[data-row]');
    if (!tr) return;
    var row = rowById(tr.getAttribute('data-row'));
    var col = colById(td.getAttribute('data-col'));
    if (!row || !col) return;
    if (td.querySelector('input, select')) return;
    switch (col.type){
      case 'checkbox': commitCell(row, col, !(row.c[col.id] === true)); break;
      case 'select': openOptionPicker(td, row, col, false); break;
      case 'multiselect': openOptionPicker(td, row, col, true); break;
      case 'image':
        if (e.target.closest('.cell-img-clear')){ commitCell(row, col, ''); }
        else { pendingImage = {kind: 'cell', rowId: row.id, colId: col.id}; $('image-input').click(); }
        break;
      case 'country': beginCountryEdit(td, row, col); break;
      default: beginInlineEdit(td, row, col);
    }
  }

  function beginInlineEdit(td, row, col){
    var cell = td.querySelector('.cell');
    if (!cell) return;
    var input = document.createElement('input');
    input.type = col.type === 'number' ? 'number' : col.type === 'date' ? 'date' : 'text';
    var cur = row.c[col.id];
    input.value = (cur == null || cur === '') ? '' : cur;
    if (col.type === 'number') input.step = 'any';
    cell.className = 'cell';
    cell.innerHTML = '';
    cell.appendChild(input);
    input.focus();
    if (col.type === 'text') input.select();
    var done = false;
    function commit(){
      if (done) return;
      done = true;
      var v = input.value;
      if (col.type === 'number'){ var n = parseFloat(v); v = isFinite(n) ? n : ''; }
      commitCell(row, col, v);
    }
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', function(e){
      if (e.key === 'Enter') input.blur();
      if (e.key === 'Escape'){ done = true; render(); }
    });
  }

  function beginCountryEdit(td, row, col){
    var cell = td.querySelector('.cell');
    var select = document.createElement('select');
    select.innerHTML = countrySelectOptions(row.c[col.id] || '');
    cell.className = 'cell';
    cell.innerHTML = '';
    cell.appendChild(select);
    select.focus();
    var done = false;
    select.addEventListener('change', function(){ if (done) return; done = true; commitCell(row, col, select.value); });
    select.addEventListener('blur', function(){ if (!done){ done = true; render(); } });
    select.addEventListener('keydown', function(e){ if (e.key === 'Escape'){ done = true; render(); } });
  }

  function addRow(){
    if (!table || !table.columns.length) return;
    var r = {id: uid(), c: {}};
    table.columns.forEach(function(c){ r.c[c.id] = emptyValue(c.type); });
    table.rows.push(r);
    view.query = ''; $('search-input').value = ''; $('clear-search-btn').style.display = 'none';
    view.filterValue = 'all';
    recordHistory(r);
    markRow(r.id);
    scheduleSave();
    render();
    var pc = primaryCol();
    if (pc && pc.type === 'text'){
      var sel = 'tr[data-row="' + r.id + '"] td[data-col="' + pc.id + '"]';
      var td = document.querySelector(sel);
      if (!td && rendered.virtual){
        // long table: jump to the new row first so it gets drawn
        var info = getItems();
        var idx = info.items.findIndex(function(it){ return it.t === 'r' && it.row.id === r.id; });
        if (idx >= 0){
          var offs = computeOffsets(info);
          window.scrollTo(0, Math.max(0, $('grid-body').getBoundingClientRect().top + window.pageYOffset + offs[idx] - (window.innerHeight || 800) / 2));
          renderBody();
          td = document.querySelector(sel);
        }
      }
      if (td){ td.scrollIntoView({block: 'nearest'}); beginInlineEdit(td, r, pc); }
    }
  }

  function deleteRow(id){
    var r = rowById(id);
    if (!r) return;
    if (!confirm('Delete \u201C' + rowLabel(r) + '\u201D from this table?')) return;
    markDeleted(r);
    table.rows = table.rows.filter(function(x){ return x.id !== id; });
    markRow(id);
    scheduleSave();
    render();
  }

  /* ================= popovers ================= */
  var popoverAnchor = null;
  function openPopover(anchor, html){
    var pop = $('popover');
    pop.innerHTML = html;
    pop.style.display = 'block';
    popoverAnchor = anchor;
    var r = anchor.getBoundingClientRect();
    var pw = pop.offsetWidth, ph = pop.offsetHeight;
    var left = Math.min(Math.max(8, r.left), window.innerWidth - pw - 8);
    var top = r.bottom + 4;
    if (top + ph > window.innerHeight - 8) top = Math.max(8, r.top - ph - 4);
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
    return pop;
  }
  function closePopover(){
    var pop = $('popover');
    pop.style.display = 'none';
    pop.innerHTML = '';
    popoverAnchor = null;
  }
  function popoverOpen(){ return $('popover').style.display === 'block'; }

  /* ---- dropdown / multi-select picker ---- */
  function openOptionPicker(anchor, row, col, multi){
    var pop = openPopover(anchor, '<input class="pop-input" id="pick-input" placeholder="Search or create\u2026" autocomplete="off"><div id="pick-list"></div>' +
      '<div class="pop-sep"></div><button class="pop-item" data-act="clear">Clear</button>');
    var input = $('pick-input');
    var list = $('pick-list');
    function current(){ return row.c[col.id]; }
    function isSel(id){ return multi ? (Array.isArray(current()) && current().indexOf(id) !== -1) : current() === id; }
    function draw(){
      var q = input.value.trim().toLowerCase();
      var html = '';
      (col.options || []).forEach(function(o){
        if (q && o.label.toLowerCase().indexOf(q) === -1) return;
        html += '<button class="pop-item" data-opt="' + esc(o.id) + '"><span class="pop-check">' + (isSel(o.id) ? SVG_CHECK : '') + '</span>' + tagHtml(o) + '</button>';
      });
      var exact = (col.options || []).some(function(o){ return o.label.toLowerCase() === q; });
      if (q && !exact) html += '<button class="pop-item" data-act="create"><span class="pop-check">+</span>Create \u201C' + esc(input.value.trim()) + '\u201D</button>';
      if (!html) html = '<div class="pop-empty">No options yet \u2014 type to create one.</div>';
      list.innerHTML = html;
    }
    function choose(id){
      if (multi){
        var arr = Array.isArray(current()) ? current().slice() : [];
        var i = arr.indexOf(id);
        if (i === -1) arr.push(id); else arr.splice(i, 1);
        row.c[col.id] = arr;
        recordHistory(row); markRow(row.id); scheduleSave(); afterEdit(row); draw();
      } else {
        closePopover();
        commitCell(row, col, id);
      }
    }
    function create(){
      var label = input.value.trim();
      if (!label) return;
      var o = optByLabel(col, label) || mkOption(col, label);
      input.value = '';
      choose(o.id);
      if (multi) draw();
    }
    draw();
    input.focus();
    input.addEventListener('input', draw);
    input.addEventListener('keydown', function(e){
      if (e.key === 'Escape'){ closePopover(); return; }
      if (e.key !== 'Enter') return;
      e.preventDefault();
      var q = input.value.trim().toLowerCase();
      var first = (col.options || []).find(function(o){ return !q || o.label.toLowerCase().indexOf(q) !== -1; });
      var exact = (col.options || []).find(function(o){ return o.label.toLowerCase() === q; });
      if (exact) choose(exact.id);
      else if (q && !first) create();
      else if (q && first && first.label.toLowerCase() !== q) create();
      else if (first) choose(first.id);
    });
    pop.onclick = function(e){
      var b = e.target.closest('.pop-item');
      if (!b) return;
      if (b.getAttribute('data-opt')) choose(b.getAttribute('data-opt'));
      else if (b.getAttribute('data-act') === 'create') create();
      else if (b.getAttribute('data-act') === 'clear'){ closePopover(); commitCell(row, col, multi ? [] : ''); }
    };
  }

  /* ---- column menu ---- */
  function openColumnMenu(anchor, col){
    var sort = effectiveSort();
    var isMetric = col.id === table.metricId;
    var html = '<div class="pop-label">Column name</div><input class="pop-input" id="cm-name" value="' + esc(col.name) + '">' +
      '<div class="pop-label">Type</div><select id="cm-type" class="pop-select">' + TYPE_ORDER.map(function(t){
        return '<option value="' + t + '"' + (t === col.type ? ' selected' : '') + '>' + esc(TYPES[t].label) + '</option>';
      }).join('') + '</select><div class="pop-sep"></div>';
    if (isOptionType(col.type)) html += '<button class="pop-item" data-act="options">Edit options\u2026</button>';
    if (col.type === 'number') html += '<button class="pop-item" data-act="metric">' + (isMetric ? '\u2605 Used for rankings & trends \u2014 stop using' : 'Use for rankings & trends') + '</button>';
    if (col.type === 'text' && col.id !== table.primaryId) html += '<button class="pop-item" data-act="primary">Use as the name column</button>';
    html += '<button class="pop-item" data-act="sort-asc">Sort ascending</button><button class="pop-item" data-act="sort-desc">Sort descending</button>';

    if (view.sortColId === col.id) html += '<button class="pop-item" data-act="sort-clear">Clear sort</button>';
    var idx = table.columns.indexOf(col);
    if (idx > 0) html += '<button class="pop-item" data-act="left">Move left</button>';
    if (idx < table.columns.length - 1) html += '<button class="pop-item" data-act="right">Move right</button>';
    html += '<div class="pop-sep"></div><button class="pop-item pop-danger" data-act="delete">Delete column</button>';
    var pop = openPopover(anchor, html);

    var nameInput = $('cm-name');
    function commitName(){
      var v = nameInput.value.trim();
      if (v && v !== col.name){ col.name = v; scheduleSave(); render(); }
    }
    nameInput.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ commitName(); closePopover(); }
      if (e.key === 'Escape') closePopover();
    });
    nameInput.addEventListener('blur', commitName);

    $('cm-type').addEventListener('change', function(e){
      var nt = e.target.value;
      var hasData = table.rows.some(function(r){
        var v = r.c[col.id];
        return !(v === '' || v === false || v == null || (Array.isArray(v) && !v.length));
      });
      var safe = ['number>text', 'date>text', 'checkbox>text', 'select>text', 'multiselect>text', 'country>text', 'select>multiselect', 'text>select', 'text>multiselect'];
      if (hasData && safe.indexOf(col.type + '>' + nt) === -1 &&
          !confirm('Changing this column from ' + TYPES[col.type].label + ' to ' + TYPES[nt].label + ' may change or clear some existing values. Continue?')){
        e.target.value = col.type; return;
      }
      changeColumnType(col, nt);
      closePopover();
    });

    pop.onclick = function(e){
      var b = e.target.closest('.pop-item');
      if (!b) return;
      var act = b.getAttribute('data-act');
      if (act === 'options'){ commitName(); closePopover(); openOptionsEditor(col); return; }
      if (act === 'metric'){ closePopover(); setMetric(isMetric ? null : col.id); return; }
      if (act === 'primary'){ table.primaryId = col.id; closePopover(); scheduleSave(); render(); return; }
      if (act === 'sort-asc' || act === 'sort-desc'){ view.sortColId = col.id; view.sortDir = act === 'sort-asc' ? 'asc' : 'desc'; closePopover(); render(); return; }
      if (act === 'sort-clear'){ view.sortColId = ''; closePopover(); render(); return; }
      if (act === 'reset-width'){ delete col.width; closePopover(); scheduleSave(); render(); return; }
      if (act === 'left' || act === 'right'){
        var i = table.columns.indexOf(col), j = act === 'left' ? i - 1 : i + 1;
        table.columns.splice(i, 1); table.columns.splice(j, 0, col);
        closePopover(); scheduleSave(); render(); return;
      }
      if (act === 'delete'){ closePopover(); deleteColumn(col); }
    };
  }

  function changeColumnType(col, newType){
    if (col.type === newType) return;
    convertColumn(col, newType);
    if (col.id === table.metricId && newType !== 'number'){ table.metricId = null; resetHistory(); }
    markAllRows();
    if (col.id === table.primaryId && newType !== 'text'){
      var alt = table.columns.find(function(c){ return c !== col && c.type === 'text'; });
      table.primaryId = alt ? alt.id : table.primaryId;
    }
    if (view.sortColId === col.id) view.sortColId = '';
    recordAllHistory();
    scheduleSave();
    render();
  }

  function setMetric(colId){
    if (colId === table.metricId) return;
    var hasHistory = Object.keys(table.history).length > 0;
    if (colId && hasHistory && table.metricId &&
        !confirm('Switching the metric starts a new history; trends and past-date rankings for the previous metric will be cleared. Continue?')) return;
    if (!colId && hasHistory && !confirm('Stop using this column for rankings & trends? Its recorded history will be cleared.')) return;
    table.metricId = colId;
    resetHistory();
    recordAllHistory();
    if (view.sortColId && !colById(view.sortColId)) view.sortColId = '';
    scheduleSave();
    render();
  }

  function deleteColumn(col){
    if (table.columns.length <= 1){ alert('A table needs at least one column.'); return; }
    if (!confirm('Delete the column \u201C' + col.name + '\u201D and all of its values? This cannot be undone.')) return;
    table.columns = table.columns.filter(function(c){ return c !== col; });
    table.rows.forEach(function(r){ delete r.c[col.id]; });
    markAllRows();
    if (table.primaryId === col.id){
      var p = table.columns.find(function(c){ return c.type === 'text'; }) || table.columns[0];
      table.primaryId = p.id;
    }
    if (table.metricId === col.id){ table.metricId = null; resetHistory(); }
    if (view.sortColId === col.id) view.sortColId = '';
    if (view.groupColId === col.id){ view.groupColId = ''; view.filterValue = 'all'; }
    recordAllHistory();
    scheduleSave();
    render();
  }

  function openAddColumn(anchor){
    var html = '<div class="pop-label">New column</div><input class="pop-input" id="ac-name" placeholder="Column name (optional)" autocomplete="off">' +
      '<div class="pop-label">Pick a type</div><div class="type-grid">' + TYPE_ORDER.map(function(t){

  /* ---- options editor (dropdown / multi-select) ---- */
  var pendingImage = null;
  function openOptionsEditor(col){
    var body = openDialog('Options \u2014 ' + col.name, false);
    dlgOnClose = function(){
      col.options = col.options.filter(function(o){ return o.label.trim(); });

    };
    function draw(){

      col.options.forEach(function(o){
        var p = TAG_PALETTE[o.color % TAG_PALETTE.length];
        html += '<div class="opt-row" data-opt="' + esc(o.id) + '">' +
          '<button class="opt-color" data-act="color" title="Change color" style="background:' + p.bg + ';box-shadow:0 0 0 2px ' + p.fg + ';"></button>' +
          '<input class="opt-label" value="' + esc(o.label) + '" placeholder="Option name">' +
          '<button class="opt-logo" data-act="logo" title="' + (o.img ? 'Replace logo' : 'Add a logo') + '">' + (o.img && imgSrc(o.img) ? '<img src="' + esc(imgSrc(o.img)) + '" alt="">' : '+') + '</button>' +
          (o.img ? '<button class="opt-x" data-act="clear-logo" title="Remove logo">&#8856;</button>' : '') +

    draw();
    body.onclick = function(e){

        if (inp){ inp.focus(); inp.select(); }

          var v = r.c[col.id];

          if (col.type === 'multiselect' && Array.isArray(v)) r.c[col.id] = v.filter(function(id){ return id !== o2.id; });

    body.oninput = function(e){
